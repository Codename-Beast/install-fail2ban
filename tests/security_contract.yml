---
- name: Validate Fail2Ban security contracts
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../roles/install-fail2ban/defaults/main.yml
  vars:
    fail2ban_nft_all_sets:
      - family: inet
        table: filter
        name: monitoring
        type: ipv4_addr
        comment: fail2ban-ignore
        elem: [192.0.2.10]
      - family: inet
        table: filter
        name: administrators
        type: ipv4_addr
        comment: fail2ban-admin
        elem: [198.51.100.20]
      - family: inet
        table: filter
        name: public-service
        type: ipv4_addr
        comment: public-web-sources
        elem: [203.0.113.0/24]
    valid_ip_values:
      - 127.0.0.1
      - 192.0.2.0/24
      - 2001:db8::1
      - 2001:db8::/48
      - ::1
    invalid_ip_values:
      - 999.1.1.1
      - 192.0.2.1/99
      - 2001:db8::/129
      - 2001:::1
      - not-an-ip
    migration_inventory: >-
      {{
        lookup('file', playbook_dir + '/../inventory/group_vars/fail2ban_targets.yml')
        | from_yaml
      }}
    preflight_tasks: >-
      {{
        lookup('file', playbook_dir + '/../roles/install-fail2ban/tasks/preflight.yml')
        | from_yaml
      }}
    install_config_tasks: >-
      {{
        lookup('file', playbook_dir + '/../roles/install-fail2ban/tasks/install-config.yml')
        | from_yaml
      }}
    fail2ban_daemon_config: >-
      {{ lookup('file', playbook_dir + '/../roles/install-fail2ban/files/99-web-protection.local') }}
    safety_check_task_names:
      - "Preflight | validate nft whitelist discovery mode"
      - "Preflight | validate nft whitelist set types"
      - "Preflight | require nft whitelist set"
      - "Preflight | validate nft whitelist element structure"
      - "Preflight | validate imported nft addresses"
      - "Preflight | require nft whitelist addresses"
      - "Preflight | require trusted SSH admin whitelist"
      - "Preflight | validate effective whitelist"
  tasks:
    - name: "Test | require configurable whitelist safety checks"
      assert:
        that:
          - fail2ban_whitelist_safety_checks_enabled is defined
          - fail2ban_whitelist_safety_checks_enabled | type_debug == 'bool'
          - fail2ban_whitelist_safety_checks_enabled | bool

    - name: "Test | require migration inventory override"
      assert:
        that:
          - migration_inventory.fail2ban_whitelist_safety_checks_enabled is defined
          - not (migration_inventory.fail2ban_whitelist_safety_checks_enabled | bool)

    - name: "Test | require every whitelist safety task to honor the switch"
      assert:
        that:
          - matching_preflight_tasks | length == 1
          - "'fail2ban_whitelist_safety_checks_enabled' in (matching_preflight_tasks[0].when | string)"
      vars:
        matching_preflight_tasks: >-
          {{ preflight_tasks | selectattr('name', 'equalto', item) | list }}
      loop: "{{ safety_check_task_names }}"
      loop_control:
        label: "{{ item }}"

    - name: "Test | require visible migration warning"
      assert:
        that:
          - migration_warning_tasks | length == 1
          - "'fail2ban_whitelist_safety_checks_enabled' in (migration_warning_tasks[0].when | string)"
      vars:
        migration_warning_tasks: >-
          {{
            preflight_tasks
            | selectattr('name', 'equalto', 'Preflight | warn about disabled whitelist safety checks')
            | list
          }}

    - name: "Test | require recidive log bootstrap"
      assert:
        that:
          - recidive_log_tasks | length == 1
          - recidive_log_tasks[0]['copy']['dest'] == '/var/log/fail2ban.log'
          - not (recidive_log_tasks[0]['copy']['force'] | bool)
          - "'fail2ban_recidive_enabled' in (recidive_log_tasks[0].when | string)"
      vars:
        recidive_log_tasks: >-
          {{
            install_config_tasks
            | selectattr('name', 'equalto', 'Config | prepare recidive log')
            | list
          }}

    - name: "Test | require explicit IPv6 mode"
      assert:
        that:
          - "'allowipv6 = auto' in fail2ban_daemon_config"

    - name: "Test | require package jail.conf recovery"
      assert:
        that:
          - jail_conf_stat_tasks | length == 1
          - jail_conf_restore_tasks | length == 1
          - jail_conf_stat_tasks[0]['stat']['path'] == '/etc/fail2ban/jail.conf'
          - jail_conf_policy_tasks | length == 1
          - jail_conf_policy_tasks[0]['copy']['dest'] == '/usr/sbin/policy-rc.d'
          - "'exit 101' in jail_conf_policy_tasks[0]['copy']['content']"
          - jail_conf_reinstall_tasks | length == 1
          - "'--force-confmiss' in jail_conf_reinstall_tasks[0]['command']['cmd']"
          - "'--reinstall' in jail_conf_reinstall_tasks[0]['command']['cmd']"
          - jail_conf_policy_cleanup_tasks | length == 1
          - jail_conf_policy_restore_tasks | length == 1
          - "'not fail2ban_jail_conf_stat.stat.exists' in (jail_conf_restore_tasks[0].when | string)"
      vars:
        jail_conf_stat_tasks: >-
          {{
            install_config_tasks
            | selectattr('name', 'equalto', 'Setup | check package jail.conf')
            | list
          }}
        jail_conf_restore_tasks: >-
          {{
            install_config_tasks
            | selectattr('name', 'equalto', 'Setup | restore missing package jail.conf')
            | list
          }}
        jail_conf_restore_block: "{{ jail_conf_restore_tasks[0].block | default([]) }}"
        jail_conf_restore_always: "{{ jail_conf_restore_tasks[0].always | default([]) }}"
        jail_conf_policy_tasks: >-
          {{
            jail_conf_restore_block
            | selectattr('name', 'equalto', 'Setup | install temporary service policy')
            | list
          }}
        jail_conf_reinstall_tasks: >-
          {{
            jail_conf_restore_block
            | selectattr('name', 'equalto', 'Setup | reinstall Fail2Ban package')
            | list
          }}
        jail_conf_policy_cleanup_tasks: >-
          {{
            jail_conf_restore_always
            | selectattr('name', 'equalto', 'Setup | remove temporary service policy')
            | list
          }}
        jail_conf_policy_restore_tasks: >-
          {{
            jail_conf_restore_always
            | selectattr('name', 'equalto', 'Setup | restore existing service policy')
            | list
          }}

    - name: "Test | select comment-marked nft sets"
      include_role:
        name: install-fail2ban
        tasks_from: nft-select-sets.yml
      vars:
        fail2ban_nft_whitelist_discovery_mode: comment

    - name: "Test | verify comment-driven trust separation"
      assert:
        that:
          - fail2ban_nft_whitelist_sets | map(attribute='name') | list == ['monitoring', 'administrators']
          - fail2ban_nft_admin_whitelist_sets | map(attribute='name') | list == ['administrators']
          - "'public-service' not in (fail2ban_nft_whitelist_sets | map(attribute='name') | list)"

    - name: "Test | select explicit nft set identities"
      include_role:
        name: install-fail2ban
        tasks_from: nft-select-sets.yml
      vars:
        fail2ban_nft_whitelist_discovery_mode: explicit
        fail2ban_nft_whitelist_explicit_set_keys:
          - inet/filter/public-service
        fail2ban_nft_admin_explicit_set_keys:
          - inet/filter/administrators

    - name: "Test | verify exact explicit set selection"
      assert:
        that:
          - fail2ban_nft_whitelist_sets | map(attribute='name') | list == ['administrators', 'public-service']
          - fail2ban_nft_admin_whitelist_sets | map(attribute='name') | list == ['administrators']

    - name: "Test | accept valid IP and CIDR values"
      assert:
        that:
          - (item | ansible.utils.ipaddr) != false
      loop: "{{ valid_ip_values }}"

    - name: "Test | reject invalid IP and CIDR values"
      assert:
        that:
          - (item | ansible.utils.ipaddr) == false
      loop: "{{ invalid_ip_values }}"
