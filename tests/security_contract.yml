---
- name: Validate Fail2Ban security contracts
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../roles/install-fail2ban/defaults/main.yml
  vars:
    fail2ban_nft_all_sets:
      - family: inet
        table: filter
        name: monitoring
        type: ipv4_addr
        comment: fail2ban-ignore
        elem: [192.0.2.10]
      - family: inet
        table: filter
        name: administrators
        type: ipv4_addr
        comment: fail2ban-admin
        elem: [198.51.100.20]
      - family: inet
        table: filter
        name: public-service
        type: ipv4_addr
        comment: public-web-sources
        elem: [203.0.113.0/24]
    valid_ip_values:
      - 127.0.0.1
      - 192.0.2.0/24
      - 2001:db8::1
      - 2001:db8::/48
      - ::1
    invalid_ip_values:
      - 999.1.1.1
      - 192.0.2.1/99
      - 2001:db8::/129
      - 2001:::1
      - not-an-ip
    migration_inventory: >-
      {{
        lookup('file', playbook_dir + '/../inventory/group_vars/fail2ban_targets.yml')
        | from_yaml
      }}
    preflight_tasks: >-
      {{
        lookup('file', playbook_dir + '/../roles/install-fail2ban/tasks/preflight.yml')
        | from_yaml
      }}
    safety_check_task_names:
      - "Preflight | validate nft whitelist discovery mode"
      - "Preflight | validate nft whitelist set types"
      - "Preflight | require nft whitelist set"
      - "Preflight | validate nft whitelist element structure"
      - "Preflight | validate imported nft addresses"
      - "Preflight | require nft whitelist addresses"
      - "Preflight | require trusted SSH admin whitelist"
      - "Preflight | validate effective whitelist"
  tasks:
    - name: "Test | require configurable whitelist safety checks"
      assert:
        that:
          - fail2ban_whitelist_safety_checks_enabled is defined
          - fail2ban_whitelist_safety_checks_enabled | type_debug == 'bool'
          - fail2ban_whitelist_safety_checks_enabled | bool

    - name: "Test | require migration inventory override"
      assert:
        that:
          - migration_inventory.fail2ban_whitelist_safety_checks_enabled is defined
          - not (migration_inventory.fail2ban_whitelist_safety_checks_enabled | bool)

    - name: "Test | require every whitelist safety task to honor the switch"
      assert:
        that:
          - matching_preflight_tasks | length == 1
          - "'fail2ban_whitelist_safety_checks_enabled' in (matching_preflight_tasks[0].when | string)"
      vars:
        matching_preflight_tasks: >-
          {{ preflight_tasks | selectattr('name', 'equalto', item) | list }}
      loop: "{{ safety_check_task_names }}"
      loop_control:
        label: "{{ item }}"

    - name: "Test | require visible migration warning"
      assert:
        that:
          - migration_warning_tasks | length == 1
          - "'fail2ban_whitelist_safety_checks_enabled' in (migration_warning_tasks[0].when | string)"
      vars:
        migration_warning_tasks: >-
          {{
            preflight_tasks
            | selectattr('name', 'equalto', 'Preflight | warn about disabled whitelist safety checks')
            | list
          }}

    - name: "Test | select comment-marked nft sets"
      include_role:
        name: install-fail2ban
        tasks_from: nft-select-sets.yml
      vars:
        fail2ban_nft_whitelist_discovery_mode: comment

    - name: "Test | verify comment-driven trust separation"
      assert:
        that:
          - fail2ban_nft_whitelist_sets | map(attribute='name') | list == ['monitoring', 'administrators']
          - fail2ban_nft_admin_whitelist_sets | map(attribute='name') | list == ['administrators']
          - "'public-service' not in (fail2ban_nft_whitelist_sets | map(attribute='name') | list)"

    - name: "Test | select explicit nft set identities"
      include_role:
        name: install-fail2ban
        tasks_from: nft-select-sets.yml
      vars:
        fail2ban_nft_whitelist_discovery_mode: explicit
        fail2ban_nft_whitelist_explicit_set_keys:
          - inet/filter/public-service
        fail2ban_nft_admin_explicit_set_keys:
          - inet/filter/administrators

    - name: "Test | verify exact explicit set selection"
      assert:
        that:
          - fail2ban_nft_whitelist_sets | map(attribute='name') | list == ['administrators', 'public-service']
          - fail2ban_nft_admin_whitelist_sets | map(attribute='name') | list == ['administrators']

    - name: "Test | accept valid IP and CIDR values"
      assert:
        that:
          - (item | ansible.utils.ipaddr) != false
      loop: "{{ valid_ip_values }}"

    - name: "Test | reject invalid IP and CIDR values"
      assert:
        that:
          - (item | ansible.utils.ipaddr) == false
      loop: "{{ invalid_ip_values }}"
