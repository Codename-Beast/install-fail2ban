---
- name: Validate Fail2Ban security contracts
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../roles/install-fail2ban/defaults/main.yml
  vars:
    preflight_tasks: >-
      {{
        lookup('file', playbook_dir + '/../roles/install-fail2ban/tasks/preflight.yml')
        | from_yaml
      }}
    install_config_tasks: >-
      {{
        lookup('file', playbook_dir + '/../roles/install-fail2ban/tasks/install-config.yml')
        | from_yaml
      }}
    fail2ban_daemon_config: >-
      {{ lookup('file', playbook_dir + '/../roles/install-fail2ban/files/99-web-protection.local') }}
    defaults_text: >-
      {{ lookup('file', playbook_dir + '/../roles/install-fail2ban/defaults/main.yml') }}
    preflight_text: >-
      {{ lookup('file', playbook_dir + '/../roles/install-fail2ban/tasks/preflight.yml') }}
  tasks:
    - name: "Test | require no nftables whitelist import"
      assert:
        that:
          - "'nft_whitelist' not in defaults_text"
          - "'nft_whitelist' not in preflight_text"
          - "'nft ruleset' not in preflight_text"
          - "'nft -j list ruleset' not in preflight_text"

    - name: "Test | require explicit whitelist build"
      assert:
        that:
          - effective_whitelist_tasks | length == 1
          - "'fail2ban_base_ignoreip' in (effective_whitelist_tasks[0] | string)"
          - "'fail2ban_ignoreip' in (effective_whitelist_tasks[0] | string)"
          - "'fail2ban_trusted_ips' in (effective_whitelist_tasks[0] | string)"
          - "'fail2ban_admin_ips' in (effective_whitelist_tasks[0] | string)"
          - "'fail2ban_allowed_ips' in (effective_whitelist_tasks[0] | string)"
      vars:
        effective_whitelist_tasks: >-
          {{
            preflight_tasks
            | selectattr('name', 'equalto', 'Preflight | build effective whitelist')
            | list
          }}

    - name: "Test | require optional nftables allow-set protection"
      assert:
        that:
          - nft_allow_render_tasks | length == 1
          - nft_allow_render_tasks[0]['template']['src'] == 'fail2ban-allowsets.nft.j2'
          - "'fail2ban_nft_allow_sets_overwrite' in (nft_allow_render_tasks[0]['template']['force'] | string)"
          - "'-c -f %s' in nft_allow_render_tasks[0]['template']['validate']"
          - nft_allow_protect_tasks | length == 1
          - "'fail2ban_nft_allow_sets_overwrite' in (nft_allow_protect_tasks[0].when | string)"
          - nft_allow_apply_tasks | length == 1
          - "'fail2ban_nft_allow_sets_apply' in (nft_allow_apply_tasks[0].when | string)"
      vars:
        nft_allow_render_tasks: >-
          {{
            install_config_tasks
            | selectattr('name', 'equalto', 'Nftables | render allow-set file')
            | list
          }}
        nft_allow_protect_tasks: >-
          {{
            install_config_tasks
            | selectattr('name', 'equalto', 'Nftables | protect existing allow-set file')
            | list
          }}
        nft_allow_apply_tasks: >-
          {{
            install_config_tasks
            | selectattr('name', 'equalto', 'Nftables | apply allow-set file')
            | list
          }}

    - name: "Test | require recidive log bootstrap"
      assert:
        that:
          - recidive_log_tasks | length == 1
          - recidive_log_tasks[0]['copy']['dest'] == '/var/log/fail2ban.log'
          - not (recidive_log_tasks[0]['copy']['force'] | bool)
          - "'fail2ban_recidive_enabled' in (recidive_log_tasks[0].when | string)"
      vars:
        recidive_log_tasks: >-
          {{
            install_config_tasks
            | selectattr('name', 'equalto', 'Config | prepare recidive log')
            | list
          }}

    - name: "Test | require explicit IPv6 mode"
      assert:
        that:
          - "'allowipv6 = auto' in fail2ban_daemon_config"

    - name: "Test | require package jail.conf recovery"
      assert:
        that:
          - jail_conf_stat_tasks | length == 1
          - jail_conf_restore_tasks | length == 1
          - jail_conf_stat_tasks[0]['stat']['path'] == '/etc/fail2ban/jail.conf'
          - jail_conf_policy_tasks | length == 1
          - jail_conf_policy_tasks[0]['copy']['dest'] == '/usr/sbin/policy-rc.d'
          - "'exit 101' in jail_conf_policy_tasks[0]['copy']['content']"
          - jail_conf_reinstall_tasks | length == 1
          - "'--force-confmiss' in jail_conf_reinstall_tasks[0]['command']['cmd']"
          - "'--reinstall' in jail_conf_reinstall_tasks[0]['command']['cmd']"
          - jail_conf_policy_cleanup_tasks | length == 1
          - jail_conf_policy_restore_tasks | length == 1
          - "'not fail2ban_jail_conf_stat.stat.exists' in (jail_conf_restore_tasks[0].when | string)"
      vars:
        jail_conf_stat_tasks: >-
          {{
            install_config_tasks
            | selectattr('name', 'equalto', 'Setup | check package jail.conf')
            | list
          }}
        jail_conf_restore_tasks: >-
          {{
            install_config_tasks
            | selectattr('name', 'equalto', 'Setup | restore missing package jail.conf')
            | list
          }}
        jail_conf_restore_block: "{{ jail_conf_restore_tasks[0].block | default([]) }}"
        jail_conf_restore_always: "{{ jail_conf_restore_tasks[0].always | default([]) }}"
        jail_conf_policy_tasks: >-
          {{
            jail_conf_restore_block
            | selectattr('name', 'equalto', 'Setup | install temporary service policy')
            | list
          }}
        jail_conf_reinstall_tasks: >-
          {{
            jail_conf_restore_block
            | selectattr('name', 'equalto', 'Setup | reinstall Fail2Ban package')
            | list
          }}
        jail_conf_policy_cleanup_tasks: >-
          {{
            jail_conf_restore_always
            | selectattr('name', 'equalto', 'Setup | remove temporary service policy')
            | list
          }}
        jail_conf_policy_restore_tasks: >-
          {{
            jail_conf_restore_always
            | selectattr('name', 'equalto', 'Setup | restore existing service policy')
            | list
          }}
