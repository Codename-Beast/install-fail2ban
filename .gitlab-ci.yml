ansible lint:
  stage: lint
  image: python:3.13-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git fail2ban
    - pip install --no-cache-dir ansible-core==2.21.0 ansible-lint==26.6.0
  script:
    - ansible-lint .
