stages:
  - validate
  - lint

variables:
  ANSIBLE_ROLES_PATH: "$CI_PROJECT_DIR/roles"
  ANSIBLE_COLLECTIONS_PATH: "$CI_PROJECT_DIR/.cache/collections"
  DEBIAN_FRONTEND: noninteractive
  PIP_ROOT_USER_ACTION: ignore

.validate_ansible:
  stage: validate
  image: "python:${PYTHON_VERSION}-slim"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends fail2ban
    - pip install --no-cache-dir "ansible-core==${ANSIBLE_VERSION}" netaddr==1.3.0
    - ansible-galaxy collection install -r collections/requirements.yml -p .cache/collections
  script:
    - ansible-playbook -i tests/inventory.ini install_fail2ban.yml --syntax-check
    - ansible-playbook -i tests/inventory.ini tests/render_filters.yml --syntax-check
    - ansible-playbook -i tests/inventory.ini tests/security_contract.yml --syntax-check
    - ansible-playbook -i tests/inventory.ini tests/regex.yml --syntax-check
    - ansible-playbook -i tests/inventory.ini tests/security_contract.yml
    - ansible-playbook -i tests/inventory.ini tests/regex.yml

validate ansible 2.12:
  extends: .validate_ansible
  variables:
    ANSIBLE_VERSION: "2.12.10"
    PYTHON_VERSION: "3.11"

validate ansible 2.21:
  extends: .validate_ansible
  variables:
    ANSIBLE_VERSION: "2.21.2"
    PYTHON_VERSION: "3.13"

ansible lint:
  stage: lint
  image: python:3.13-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git fail2ban
    - pip install --no-cache-dir ansible-core==2.21.2 ansible-lint==26.6.0 netaddr==1.3.0
    - ansible-galaxy collection install -r collections/requirements.yml -p .cache/collections
  script:
    - ansible-lint .
