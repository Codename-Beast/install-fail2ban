---
install_fail2ban_role_version: "1.0.0"

# install_fail2ban defaults
#
# Security model:
#   - nftables must already exist on the target host.
#   - The role installs Fail2Ban only, not nftables.
#   - Managed jails live in a dedicated file.
#   - No global [DEFAULT] jail block is written to avoid changing unrelated jails.
#   - Whitelisting is rendered per managed jail as ignoreip.

# -- Packages ------------------------------------------------------
install_fail2ban_packages:
  - fail2ban

# -- Preflight -----------------------------------------------------
install_fail2ban_require_nftables: true
install_fail2ban_require_apache_log_dir: true
install_fail2ban_apache_log_dir: /var/log/apache2

# -- Backup --------------------------------------------------------
# Initial safety backup. The marker prevents one tar archive per idempotent run.
install_fail2ban_backup_existing_config: true
install_fail2ban_backup_dir: /root/fail2ban-backup
install_fail2ban_backup_marker: /root/fail2ban-backup/.install_fail2ban_initial_backup_done

# -- IP-Whitelist --------------------------------------------------
# Base addresses are always protected from bans.
install_fail2ban_base_ignoreip:
  - 127.0.0.1/8
  - "::1"

# Backward-compatible alias. Existing users may continue to override this list.
install_fail2ban_ignoreip:
  - 127.0.0.1/8
  - "::1"

# Trusted source IPs: VPN, jump host, monitoring.
# With the sshd jail enabled, at least the VPN or jump-host IP must be set.
install_fail2ban_ip_whitelist_enabled: true
install_fail2ban_trusted_ips: []
install_fail2ban_allowed_ips: []
# Example:
# install_fail2ban_allowed_ips:
#   - 203.0.113.55
#   - 198.51.100.0/24

# Optional: read existing nftables sets and append them to Fail2Ban ignoreip.
# This is opt-in because a full nftables ruleset may contain blocklists too.
# Only explicitly named allowlist sets are imported.
install_fail2ban_nft_whitelist_import_enabled: false
install_fail2ban_nft_whitelist_set_names:
  - monitoring_ips
  - monitoring_ipv4
  - monitoring_ipv6
  - management_ips
  - mgmt_ips
  - trusted_ips
  - fail2ban_ignore

# -- Log paths -----------------------------------------------------
# Active logs only. Do not use *access.log because rotated files may be included.
install_fail2ban_access_log: /var/log/apache2/*access.log
install_fail2ban_error_log: /var/log/apache2/*error.log

# -- Fail2Ban Action Defaults -------------------------------------
install_fail2ban_banaction: nftables
install_fail2ban_banaction_allports: "nftables[type=allports]"
install_fail2ban_backend: auto
install_fail2ban_usedns: "no"
install_fail2ban_ignoreself: true

# -- Managed jails -------------------------------------------------
# Recommended defaults: these jails are enabled by default.
install_fail2ban_sshd_enabled: true
install_fail2ban_malicious_paths_enabled: true
install_fail2ban_scanner_useragents_enabled: true
install_fail2ban_scanburst_enabled: true
install_fail2ban_overflows_enabled: true
install_fail2ban_shellshock_enabled: true
install_fail2ban_recidive_enabled: true

# Useful, but not enabled blindly. Test against real logs first.
install_fail2ban_apache_auth_enabled: false
install_fail2ban_apache_badbots_enabled: false
install_fail2ban_apache_botsearch_enabled: false

# -- SSH daemon protection -----------------------------------------
# SSH is read from systemd-journal only; no file-log fallback.
install_fail2ban_sshd_port: ssh
install_fail2ban_sshd_backend: systemd
install_fail2ban_sshd_maxretry: 5
install_fail2ban_sshd_findtime: 10m
install_fail2ban_sshd_bantime: 1h
install_fail2ban_sshd_bantime_increment: true
install_fail2ban_sshd_bantime_multipliers: "1 2 6 24 72"
install_fail2ban_sshd_bantime_maxtime: 7d
install_fail2ban_sshd_bantime_rndtime: 5m

# -- Scanner-User-Agents -------------------------------------------
# This list is treated as literal input and regex-escaped in the template.
# Generic tools like curl/wget/python-requests are not included by default.
install_fail2ban_scanner_useragents:
  - sqlmap
  - nikto
  - nmap scripting engine
  - masscan
  - zgrab
  - zmap
  - gobuster
  - dirbuster
  - dirsearch
  - feroxbuster
  - ffuf
  - wpscan
  - nuclei
  - acunetix
  - nessus
  - openvas
  - havij
  - whatweb
  - censysinspect
  - internetmeasurement
  - jaeles
  - arachni
  - wapiti
  - skipfish

# Environment-specific additions, for example an internal scanner name.
install_fail2ban_scanner_useragents_extra: []

# User-Agent fragments that should not be banned even when matched.
# Example: authorized internal scanner with a distinct user agent.
install_fail2ban_scanner_useragents_ignore: []

# -- High-confidence permanent web bans ----------------------------
install_fail2ban_malicious_paths_maxretry: 1
install_fail2ban_malicious_paths_findtime: 1d
install_fail2ban_malicious_paths_bantime: -1

install_fail2ban_scanner_useragents_maxretry: 1
install_fail2ban_scanner_useragents_findtime: 1d
install_fail2ban_scanner_useragents_bantime: -1

install_fail2ban_overflows_maxretry: 2
install_fail2ban_overflows_findtime: 1d
install_fail2ban_overflows_bantime: -1

install_fail2ban_shellshock_maxretry: 1
install_fail2ban_shellshock_findtime: 1d
install_fail2ban_shellshock_bantime: -1

# -- Behavioral scanburst ------------------------------------------
# Conservative default for public Moodle systems and NAT/campus networks.
install_fail2ban_scanburst_maxretry: 80
install_fail2ban_scanburst_findtime: 5m
install_fail2ban_scanburst_bantime: 12h
install_fail2ban_scanburst_maxtime: 90d
install_fail2ban_scanburst_multipliers: "1 2 6 14 60 180"
install_fail2ban_scanburst_rndtime: 10m
install_fail2ban_scanburst_overalljails: false

# -- Optional built-in Apache jails --------------------------------
install_fail2ban_apache_auth_maxretry: 5
install_fail2ban_apache_auth_findtime: 10m
install_fail2ban_apache_auth_bantime: 1d

install_fail2ban_apache_badbots_maxretry: 1
install_fail2ban_apache_badbots_findtime: 1d
install_fail2ban_apache_badbots_bantime: 1d

install_fail2ban_apache_botsearch_maxretry: 2
install_fail2ban_apache_botsearch_findtime: 1d
install_fail2ban_apache_botsearch_bantime: 1d

# -- Recidive ------------------------------------------------------
install_fail2ban_recidive_maxretry: 3
install_fail2ban_recidive_findtime: 7d
install_fail2ban_recidive_bantime: -1

# -- Fail2Ban Prometheus Exporter ---------------------------------
# Official exporter: https://gitlab.com/hctrdev/fail2ban-prometheus-exporter
install_fail2ban_exporter_enabled: false
install_fail2ban_exporter_version: "0.10.3"
install_fail2ban_exporter_arch: linux_amd64
install_fail2ban_exporter_archive_url: >-
  https://gitlab.com//-/project/24199687/uploads/18c602420dfd42bdf718a70823afa657/fail2ban_exporter_0.10.3_linux_amd64.tar.gz
install_fail2ban_exporter_archive_checksum: "sha256:85733a343048090dba169226a8ca0b59b9cfecb9eaa163014a94146f04116e34"
install_fail2ban_exporter_src_dir: /usr/local/src/fail2ban_exporter
install_fail2ban_exporter_bin_path: /usr/local/bin/fail2ban_exporter
install_fail2ban_exporter_socket: /var/run/fail2ban/fail2ban.sock
install_fail2ban_exporter_listen_address: "127.0.0.1:9191"
install_fail2ban_exporter_health_url: "http://127.0.0.1:9191/metrics"
install_fail2ban_exporter_service_name: fail2ban-exporter

# SSH key logins use trusted source IPs; these must never be banned.
install_fail2ban_require_trusted_whitelist_for_sshd: true

# -- Reporting / read-only mode ------------------------------------
# report_only reads the current Fail2Ban status/config and stops without writes.
install_fail2ban_report_only: false
