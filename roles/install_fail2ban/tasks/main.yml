---
# Die Reihenfolge ist sicherheitsrelevant:
# 1. Reiner Report-Modus darf vor Preflight enden.
# 2. Voraussetzungen prüfen.
# 3. Fail2Ban installieren.
# 4. verwaltete Dateien schreiben.
# 5. Konfiguration testen.
# 6. erst danach Dienst starten/aktivieren/restarten.

- name: "Report | read Fail2Ban status"
  ansible.builtin.command:
    cmd: fail2ban-client status
  register: install_fail2ban_report_only_status
  changed_when: false
  failed_when: false
  when: install_fail2ban_report_only | bool

- name: "Report | dump Fail2Ban config"
  ansible.builtin.command:
    cmd: fail2ban-client -d
  register: install_fail2ban_report_only_dump
  changed_when: false
  failed_when: false
  when: install_fail2ban_report_only | bool

- name: "Report | show read-only result"
  debug:  # noqa: fqcn[action-core]
    msg:
      - "Fail2Ban status rc={{ install_fail2ban_report_only_status.rc | default('n/a') }}"
      - "{{ install_fail2ban_report_only_status.stdout_lines | default([]) }}"
      - "Fail2Ban config dump rc={{ install_fail2ban_report_only_dump.rc | default('n/a') }}"
      - "{{ install_fail2ban_report_only_dump.stdout_lines | default([]) }}"
      - "{{ install_fail2ban_report_only_status.stderr_lines | default([]) }}"
      - "{{ install_fail2ban_report_only_dump.stderr_lines | default([]) }}"
  when: install_fail2ban_report_only | bool

- name: "Report | stop read-only run"
  ansible.builtin.meta: end_host
  when: install_fail2ban_report_only | bool

- name: "Preflight | check supported OS"
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
      - ansible_distribution in ['Debian', 'Ubuntu']
    fail_msg: >-
      install_fail2ban unterstützt Debian/Ubuntu. Erkannt wurde:
      {{ ansible_distribution }} {{ ansible_distribution_version }}
    success_msg: "Unterstütztes System erkannt: {{ ansible_distribution }} {{ ansible_distribution_version }}"

- name: "Preflight | check Ansible version"
  ansible.builtin.assert:
    that: "ansible_version.full is version('2.10', '>=')"
    fail_msg: "install_fail2ban benötigt Ansible >= 2.10 (gefunden: {{ ansible_version.full }})"

- name: "Preflight | check explicit whitelist"
  ansible.builtin.assert:
    that:
      - item is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?$|^::1$|^[0-9A-Fa-f:]+(/[0-9]{1,3})?$')
    fail_msg: "install_fail2ban: ungültiger Whitelist-Eintrag '{{ item }}'. Bitte IP oder CIDR nutzen."
  loop: "{{ (install_fail2ban_ignoreip | default([])) + (install_fail2ban_admin_ips | default([])) + (install_fail2ban_allowed_ips | default([])) }}"
  when: install_fail2ban_ip_whitelist_enabled | bool

- name: "Preflight | require admin SSH whitelist"
  ansible.builtin.assert:
    that:
      - (install_fail2ban_admin_ips | default([])) | length > 0
    fail_msg: >-
      install_fail2ban: sshd ist aktiv, aber install_fail2ban_admin_ips ist leer.
      Trage Admin-/VPN-/Jump-Host-IPs ein, damit Admins nicht ausgesperrt werden.
  when:
    - install_fail2ban_sshd_enabled | bool
    - install_fail2ban_require_admin_whitelist_for_sshd | bool

- name: "Preflight | find nft binary"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/sbin/nft
    - /usr/bin/nft
    - /sbin/nft
    - /bin/nft
  register: install_fail2ban_nft_command_stats

- name: "Preflight | require nftables"
  ansible.builtin.fail:
    msg: >-
      Abbruch: nftables/nft ist auf dem Zielserver nicht vorhanden. Die Rolle installiert nftables bewusst nicht automatisch.
      Bitte nftables vorbereiten und erneut starten.
  when:
    - install_fail2ban_require_nftables | bool
    - not (install_fail2ban_nft_command_stats.results | selectattr('stat.exists') | list | length > 0)

- name: "Preflight | check Apache log dir"
  ansible.builtin.stat:
    path: "{{ install_fail2ban_apache_log_dir }}"
  register: install_fail2ban_apache_log_dir_stat

- name: "Preflight | require Apache log dir"
  ansible.builtin.fail:
    msg: >-
      Abbruch: {{ install_fail2ban_apache_log_dir }} fehlt. Die Standardkonfiguration erwartet
      dateibasierte Apache-Logs. Setze install_fail2ban_require_apache_log_dir: false nur bewusst.
  when:
    - install_fail2ban_require_apache_log_dir | bool
    - not install_fail2ban_apache_log_dir_stat.stat.exists

- name: "Preflight | import nft whitelist sets"
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - <<'PY'
    import json
    import re
    import subprocess

    erlaubte_sets = set({{ install_fail2ban_nft_whitelist_set_names | to_json }})
    ip_muster = re.compile(r'^([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?$|^::1$|^[0-9A-Fa-f:]+(/[0-9]{1,3})?$')

    daten = json.loads(subprocess.check_output(['nft', '-j', 'list', 'ruleset'], text=True))
    ergebnis = []

    def add_wert(wert):
        if isinstance(wert, str) and ip_muster.match(wert) and wert not in ergebnis:
            ergebnis.append(wert)
        elif isinstance(wert, dict) and 'prefix' in wert:
            prefix = wert['prefix']
            addr = prefix.get('addr')
            laenge = prefix.get('len')
            if addr is not None and laenge is not None:
                cidr = f'{addr}/{laenge}'
                if ip_muster.match(cidr) and cidr not in ergebnis:
                    ergebnis.append(cidr)

    for eintrag in daten.get('nftables', []):
        set_def = eintrag.get('set')
        if not set_def or set_def.get('name') not in erlaubte_sets:
            continue
        for element in set_def.get('elem', []) or []:
            add_wert(element)

    for wert in ergebnis:
        print(wert)
    PY
  args:
    executable: /bin/bash
  register: install_fail2ban_nft_whitelist_import
  changed_when: false
  when: install_fail2ban_nft_whitelist_import_enabled | bool

- name: "Preflight | build effective whitelist"
  ansible.builtin.set_fact:
    install_fail2ban_effective_ignoreip: >-
      {{
        (
          (install_fail2ban_ignoreip | default(install_fail2ban_base_ignoreip))
          + ((install_fail2ban_admin_ips | default([])) if (install_fail2ban_ip_whitelist_enabled | bool) else [])
          + ((install_fail2ban_allowed_ips | default([])) if (install_fail2ban_ip_whitelist_enabled | bool) else [])
          + (install_fail2ban_nft_whitelist_import.stdout_lines | default([]))
        ) | unique | list
      }}

- name: "Preflight | validate effective whitelist"
  ansible.builtin.assert:
    that:
      - item is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?$|^::1$|^[0-9A-Fa-f:]+(/[0-9]{1,3})?$')
    fail_msg: "install_fail2ban: ungültiger finaler Whitelist-Eintrag '{{ item }}'."
  loop: "{{ install_fail2ban_effective_ignoreip }}"

- name: "Report | read status before changes"
  ansible.builtin.command:
    cmd: fail2ban-client status
  register: install_fail2ban_report_before_status
  changed_when: false
  failed_when: false
  when: install_fail2ban_report_before | bool

- name: "Report | dump config before changes"
  ansible.builtin.command:
    cmd: fail2ban-client -d
  register: install_fail2ban_report_before_dump
  changed_when: false
  failed_when: false
  when: install_fail2ban_report_before | bool

- name: "Report | show before report"
  debug:  # noqa: fqcn[action-core]
    msg:
      - "Fail2Ban status rc={{ install_fail2ban_report_before_status.rc | default('n/a') }}"
      - "{{ install_fail2ban_report_before_status.stdout_lines | default([]) }}"
      - "Fail2Ban config dump rc={{ install_fail2ban_report_before_dump.rc | default('n/a') }}"
      - "{{ install_fail2ban_report_before_dump.stdout_lines | default([]) }}"
      - "{{ install_fail2ban_report_before_status.stderr_lines | default([]) }}"
      - "{{ install_fail2ban_report_before_dump.stderr_lines | default([]) }}"
  when: install_fail2ban_report_before | bool

- name: "Setup | install Fail2Ban"
  ansible.builtin.apt:
    name: "{{ install_fail2ban_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Backup | create backup dir"
  ansible.builtin.file:
    path: "{{ install_fail2ban_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: install_fail2ban_backup_existing_config | bool

- name: "Backup | check existing config"
  ansible.builtin.stat:
    path: /etc/fail2ban
  register: install_fail2ban_etc_stat

- name: "Backup | check initial marker"
  ansible.builtin.stat:
    path: "{{ install_fail2ban_backup_marker }}"
  register: install_fail2ban_backup_marker_stat
  when: install_fail2ban_backup_existing_config | bool

- name: "Backup | create initial backup"
  ansible.builtin.command:
    cmd: "tar --create --gzip --file={{ install_fail2ban_backup_dir }}/fail2ban-{{ ansible_date_time.iso8601_basic_short }}.tar.gz /etc/fail2ban"
  changed_when: true
  # noqa: command-instead-of-module
  when:
    - install_fail2ban_backup_existing_config | bool
    - install_fail2ban_etc_stat.stat.exists
    - not (install_fail2ban_backup_marker_stat.stat.exists | default(false))

- name: "Backup | write initial marker"
  ansible.builtin.copy:
    dest: "{{ install_fail2ban_backup_marker }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      Initiales Fail2Ban-Backup durch Rolle install_fail2ban.
      Host: {{ inventory_hostname }}
      Zeitpunkt: {{ ansible_date_time.iso8601 }}
  when:
    - install_fail2ban_backup_existing_config | bool
    - install_fail2ban_etc_stat.stat.exists
    - not (install_fail2ban_backup_marker_stat.stat.exists | default(false))

- name: "Config | create config dirs"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/fail2ban/fail2ban.d
    - /etc/fail2ban/filter.d
    - /etc/fail2ban/jail.d

- name: "Config | check built-in filters"
  ansible.builtin.stat:
    path: "/etc/fail2ban/filter.d/{{ item.name }}.conf"
  loop:
    - { name: "sshd", enabled: "{{ install_fail2ban_sshd_enabled }}" }
    - { name: "apache-overflows", enabled: "{{ install_fail2ban_overflows_enabled }}" }
    - { name: "apache-shellshock", enabled: "{{ install_fail2ban_shellshock_enabled }}" }
    - { name: "recidive", enabled: "{{ install_fail2ban_recidive_enabled }}" }
    - { name: "apache-auth", enabled: "{{ install_fail2ban_apache_auth_enabled }}" }
    - { name: "apache-badbots", enabled: "{{ install_fail2ban_apache_badbots_enabled }}" }
    - { name: "apache-botsearch", enabled: "{{ install_fail2ban_apache_botsearch_enabled }}" }
  register: install_fail2ban_builtin_filter_stats
  loop_control:
    label: "{{ item.name }}"

- name: "Config | require enabled filters"
  ansible.builtin.assert:
    that:
      - (not (item.item.enabled | bool)) or item.stat.exists
    fail_msg: >-
      Der aktivierte Fail2Ban-Filter '{{ item.item.name }}' fehlt auf dem Zielsystem
      (/etc/fail2ban/filter.d/{{ item.item.name }}.conf). Jail deaktivieren oder Fail2Ban-Paket prüfen.
  loop: "{{ install_fail2ban_builtin_filter_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: "Config | install daemon config"
  ansible.builtin.copy:
    src: 99-web-protection.local
    dest: /etc/fail2ban/fail2ban.d/99-web-protection.local
    owner: root
    group: root
    mode: "0644"
  register: install_fail2ban_daemon_config

- name: "Config | install static filters"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/fail2ban/filter.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - apache-malicious-paths.conf
    - apache-scanburst.conf
  register: install_fail2ban_static_filter_config

- name: "Config | render scanner filter"
  ansible.builtin.template:
    src: apache-scanner-useragents.conf.j2
    dest: /etc/fail2ban/filter.d/apache-scanner-useragents.conf
    owner: root
    group: root
    mode: "0644"
  register: install_fail2ban_scanner_filter_config

- name: "Config | render jails"
  ansible.builtin.template:
    src: 99-apache-moodle-bots.local.j2
    dest: /etc/fail2ban/jail.d/99-apache-moodle-bots.local
    owner: root
    group: root
    mode: "0644"
  register: install_fail2ban_jail_config

- name: "Verify | test Fail2Ban config"
  ansible.builtin.command:
    cmd: fail2ban-client -t
  changed_when: false

- name: "Verify | test malicious path regex"
  ansible.builtin.shell: |
    set -euo pipefail
    tmpfile="$(mktemp)"
    trap 'rm -f "$tmpfile"' EXIT
    cat >"$tmpfile" <<'EOF'
    203.0.113.10 - - [23/Jul/2026:14:00:00 +0200] "GET /.env HTTP/1.1" 404 123 "-" "Mozilla/5.0"
    203.0.113.13 - - [23/Jul/2026:14:00:03 +0200] "GET /login/index.php?redirect=/wp-login.php HTTP/1.1" 200 2048 "-" "Mozilla/5.0"
    EOF
    fail2ban-regex "$tmpfile" /etc/fail2ban/filter.d/apache-malicious-paths.conf | grep -q '1 matched, 1 missed'
  args:
    executable: /bin/bash
  changed_when: false
  when: install_fail2ban_run_filter_smoke_tests | bool

- name: "Verify | test scanner regex"
  ansible.builtin.shell: |
    set -euo pipefail
    tmpfile="$(mktemp)"
    trap 'rm -f "$tmpfile"' EXIT
    cat >"$tmpfile" <<'EOF'
    203.0.113.15 - - [23/Jul/2026:14:00:05 +0200] "GET / HTTP/1.1" 200 512 "-" "sqlmap/1.8"
    203.0.113.17 - - [23/Jul/2026:14:00:07 +0200] "GET / HTTP/1.1" 200 512 "-" "curl/8.10.0"
    EOF
    fail2ban-regex "$tmpfile" /etc/fail2ban/filter.d/apache-scanner-useragents.conf | grep -q '1 matched, 1 missed'
  args:
    executable: /bin/bash
  changed_when: false
  when: install_fail2ban_run_filter_smoke_tests | bool

- name: "Service | start and enable Fail2Ban"
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: "Service | restart on config change"
  ansible.builtin.service:
    name: fail2ban
    state: restarted
    enabled: true
  when: >-
    install_fail2ban_daemon_config.changed or
    install_fail2ban_static_filter_config.changed or
    install_fail2ban_scanner_filter_config.changed or
    install_fail2ban_jail_config.changed

- name: "Monitoring | create exporter source dir"
  ansible.builtin.file:
    path: "{{ install_fail2ban_exporter_src_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: install_fail2ban_exporter_enabled | bool

- name: "Monitoring | download Fail2Ban exporter"
  ansible.builtin.get_url:
    url: "{{ install_fail2ban_exporter_archive_url }}"
    dest: "{{ install_fail2ban_exporter_src_dir }}/fail2ban_exporter_{{ install_fail2ban_exporter_version }}_{{ install_fail2ban_exporter_arch }}.tar.gz"
    checksum: "{{ install_fail2ban_exporter_archive_checksum }}"
    owner: root
    group: root
    mode: "0644"
  register: install_fail2ban_exporter_archive
  when: install_fail2ban_exporter_enabled | bool

- name: "Monitoring | unpack Fail2Ban exporter"
  ansible.builtin.unarchive:
    src: "{{ install_fail2ban_exporter_archive.dest }}"
    dest: "{{ install_fail2ban_exporter_src_dir }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  register: install_fail2ban_exporter_unpack
  when: install_fail2ban_exporter_enabled | bool

- name: "Monitoring | install Fail2Ban exporter binary"
  ansible.builtin.copy:
    src: "{{ install_fail2ban_exporter_src_dir }}/fail2ban_exporter"
    dest: "{{ install_fail2ban_exporter_bin_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  register: install_fail2ban_exporter_binary
  when: install_fail2ban_exporter_enabled | bool

- name: "Monitoring | install Fail2Ban exporter service"
  ansible.builtin.template:
    src: fail2ban-exporter.service.j2
    dest: "/etc/systemd/system/{{ install_fail2ban_exporter_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: install_fail2ban_exporter_service
  when: install_fail2ban_exporter_enabled | bool

- name: "Monitoring | start Fail2Ban exporter"
  ansible.builtin.systemd:
    name: "{{ install_fail2ban_exporter_service_name }}"
    state: "{{ (install_fail2ban_exporter_binary.changed or install_fail2ban_exporter_service.changed) | ternary('restarted', 'started') }}"
    enabled: true
    daemon_reload: true
  when: install_fail2ban_exporter_enabled | bool

- name: "Monitoring | check Fail2Ban exporter metrics"
  ansible.builtin.uri:
    url: "{{ install_fail2ban_exporter_health_url }}"
    return_content: true
    status_code: 200
  register: install_fail2ban_exporter_metrics
  changed_when: false
  when: install_fail2ban_exporter_enabled | bool

- name: "Monitoring | verify Fail2Ban exporter metrics"
  ansible.builtin.assert:
    that:
      - "'f2b_up' in install_fail2ban_exporter_metrics.content"
    fail_msg: "install_fail2ban: Fail2Ban exporter liefert keine f2b_up Metrik"
    success_msg: "Fail2Ban exporter liefert Metriken."
  when: install_fail2ban_exporter_enabled | bool


- name: "Verify | collect service facts"
  ansible.builtin.service_facts:

- name: "Verify | check running service"
  ansible.builtin.assert:
    that:
      - ansible_facts.services['fail2ban.service'].state == 'running'
    fail_msg: "Fail2Ban läuft nach der Aktivierung nicht."
    success_msg: "Fail2Ban läuft."

- name: "Verify | list loaded jails"
  ansible.builtin.command:
    cmd: fail2ban-client status
  register: install_fail2ban_status
  changed_when: false

- name: "Verify | show Fail2Ban status"
  debug:  # noqa: fqcn[action-core]
    var: install_fail2ban_status.stdout_lines

- name: "Verify | test nft ban action"
  when: install_fail2ban_run_nft_test_ban | bool
  block:
    - name: "Verify | ban test IP"
      ansible.builtin.command:
        cmd: "fail2ban-client set apache-malicious-paths banip {{ install_fail2ban_test_ban_ip }}"
      changed_when: false

    - name: "Verify | check test IP in nft"
      ansible.builtin.command:
        cmd: nft list ruleset
      register: install_fail2ban_nft_ruleset
      changed_when: false
      failed_when: install_fail2ban_test_ban_ip not in install_fail2ban_nft_ruleset.stdout
  always:
    - name: "Verify | unban test IP"
      ansible.builtin.command:
        cmd: "fail2ban-client set apache-malicious-paths unbanip {{ install_fail2ban_test_ban_ip }}"
      changed_when: false
      failed_when: false

- name: "Report | read status after changes"
  ansible.builtin.command:
    cmd: fail2ban-client status
  register: install_fail2ban_report_after_status
  changed_when: false
  failed_when: false
  when: install_fail2ban_report_after | bool

- name: "Report | dump config after changes"
  ansible.builtin.command:
    cmd: fail2ban-client -d
  register: install_fail2ban_report_after_dump
  changed_when: false
  failed_when: false
  when: install_fail2ban_report_after | bool

- name: "Report | show after report"
  debug:  # noqa: fqcn[action-core]
    msg:
      - "Fail2Ban status rc={{ install_fail2ban_report_after_status.rc | default('n/a') }}"
      - "{{ install_fail2ban_report_after_status.stdout_lines | default([]) }}"
      - "Fail2Ban config dump rc={{ install_fail2ban_report_after_dump.rc | default('n/a') }}"
      - "{{ install_fail2ban_report_after_dump.stdout_lines | default([]) }}"
      - "{{ install_fail2ban_report_after_status.stderr_lines | default([]) }}"
      - "{{ install_fail2ban_report_after_dump.stderr_lines | default([]) }}"
  when: install_fail2ban_report_after | bool
