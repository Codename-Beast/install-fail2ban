---
- name: "Preflight | assert supported OS family"
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: "install_fail2ban supports Debian/Ubuntu only. Detected: {{ ansible_distribution }} {{ ansible_distribution_version }}"
    success_msg: "Supported OS detected: {{ ansible_distribution }} {{ ansible_distribution_version }}"

- name: "Preflight | assert Ansible version >= 2.10"
  ansible.builtin.assert:
    that: "ansible_version.full is version('2.10', '>=')"
    fail_msg: "install-fail2ban: Ansible >= 2.10 required (found {{ ansible_version.full }})"

- name: "Preflight | assert whitelist entries look like IPs or CIDRs"
  ansible.builtin.assert:
    that:
      - item is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?$|^::1$|^[0-9A-Fa-f:]+(/[0-9]{1,3})?$')
    fail_msg: "install-fail2ban: invalid whitelist entry '{{ item }}'. Use IP or CIDR notation."
  loop: "{{ (install_fail2ban_ignoreip | default([])) + (install_fail2ban_allowed_ips | default([])) }}"
  when: install_fail2ban_ip_whitelist_enabled | bool

- name: "Preflight | check known nft command locations"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/sbin/nft
    - /usr/bin/nft
    - /sbin/nft
    - /bin/nft
  register: install_fail2ban_nft_command_stats

- name: "Preflight | abort when nftables is not already present"
  ansible.builtin.fail:
    msg: >-
      Abbruch: nftables/nft ist auf dem Zielserver nicht vorhanden. Die Rolle installiert nftables bewusst nicht automatisch.
      Bitte nftables vorbereiten und erneut starten.
  when:
    - install_fail2ban_require_nftables | bool
    - not (install_fail2ban_nft_command_stats.results | selectattr('stat.exists') | list | length > 0)

- name: "Preflight | check Apache log directory"
  ansible.builtin.stat:
    path: "{{ install_fail2ban_apache_log_dir }}"
  register: install_fail2ban_apache_log_dir_stat

- name: "Preflight | abort when Apache log directory is missing"
  ansible.builtin.fail:
    msg: "Abbruch: {{ install_fail2ban_apache_log_dir }} fehlt. Die Standardkonfiguration erwartet dateibasierte Apache-Logs."
  when:
    - install_fail2ban_require_apache_log_dir | bool
    - not install_fail2ban_apache_log_dir_stat.stat.exists

- name: "Setup | install Fail2Ban package"
  ansible.builtin.apt:
    name: "{{ install_fail2ban_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Backup | ensure backup directory exists"
  ansible.builtin.file:
    path: "{{ install_fail2ban_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: install_fail2ban_backup_existing_config | bool

- name: "Backup | check existing config directory"
  ansible.builtin.stat:
    path: /etc/fail2ban
  register: install_fail2ban_etc_stat

- name: "Backup | check initial backup marker"
  ansible.builtin.stat:
    path: "{{ install_fail2ban_backup_marker }}"
  register: install_fail2ban_backup_marker_stat
  when: install_fail2ban_backup_existing_config | bool

- name: "Backup | create initial config archive"
  ansible.builtin.command:
    cmd: "tar --create --gzip --file={{ install_fail2ban_backup_dir }}/fail2ban-{{ ansible_date_time.iso8601_basic_short }}.tar.gz /etc/fail2ban"
  changed_when: true
  # noqa: command-instead-of-module
  when:
    - install_fail2ban_backup_existing_config | bool
    - install_fail2ban_etc_stat.stat.exists
    - not (install_fail2ban_backup_marker_stat.stat.exists | default(false))

- name: "Backup | write initial backup marker"
  ansible.builtin.copy:
    dest: "{{ install_fail2ban_backup_marker }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      Initial Fail2Ban backup created by install_fail2ban.
      Host: {{ inventory_hostname }}
      Time: {{ ansible_date_time.iso8601 }}
  when:
    - install_fail2ban_backup_existing_config | bool
    - install_fail2ban_etc_stat.stat.exists
    - not (install_fail2ban_backup_marker_stat.stat.exists | default(false))

- name: "Config | ensure configuration directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/fail2ban/fail2ban.d
    - /etc/fail2ban/filter.d
    - /etc/fail2ban/jail.d

- name: "Config | install daemon web protection config"
  ansible.builtin.copy:
    src: 99-web-protection.local
    dest: /etc/fail2ban/fail2ban.d/99-web-protection.local
    owner: root
    group: root
    mode: "0644"
  register: install_fail2ban_daemon_config

- name: "Config | install custom filters"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/fail2ban/filter.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - apache-malicious-paths.conf
    - apache-scanner-useragents.conf
    - apache-scanburst.conf
  register: install_fail2ban_filter_config

- name: "Config | render Apache/Moodle jail config"
  ansible.builtin.template:
    src: 99-apache-moodle-bots.local.j2
    dest: /etc/fail2ban/jail.d/99-apache-moodle-bots.local
    owner: root
    group: root
    mode: "0644"
  register: install_fail2ban_jail_config

- name: "Verify | validate Fail2Ban configuration before activation"
  ansible.builtin.command:
    cmd: fail2ban-client -t
  changed_when: false

- name: "Verify | regex smoke test malicious paths"
  ansible.builtin.shell: |
    set -euo pipefail
    tmpfile="$(mktemp)"
    trap 'rm -f "$tmpfile"' EXIT
    cat >"$tmpfile" <<'EOF'
    203.0.113.10 - - [23/Jul/2026:14:00:00 +0200] "GET /.env HTTP/1.1" 404 123 "-" "Mozilla/5.0"
    203.0.113.13 - - [23/Jul/2026:14:00:03 +0200] "GET /login/index.php?redirect=/wp-login.php HTTP/1.1" 200 2048 "-" "Mozilla/5.0"
    EOF
    fail2ban-regex "$tmpfile" /etc/fail2ban/filter.d/apache-malicious-paths.conf | grep -q '1 matched, 1 missed'
  args:
    executable: /bin/bash
  changed_when: false
  when: install_fail2ban_run_filter_smoke_tests | bool

- name: "Verify | regex smoke test scanner user agents"
  ansible.builtin.shell: |
    set -euo pipefail
    tmpfile="$(mktemp)"
    trap 'rm -f "$tmpfile"' EXIT
    cat >"$tmpfile" <<'EOF'
    203.0.113.15 - - [23/Jul/2026:14:00:05 +0200] "GET / HTTP/1.1" 200 512 "-" "sqlmap/1.8"
    203.0.113.17 - - [23/Jul/2026:14:00:07 +0200] "GET / HTTP/1.1" 200 512 "-" "curl/8.10.0"
    EOF
    fail2ban-regex "$tmpfile" /etc/fail2ban/filter.d/apache-scanner-useragents.conf | grep -q '1 matched, 1 missed'
  args:
    executable: /bin/bash
  changed_when: false
  when: install_fail2ban_run_filter_smoke_tests | bool

- name: "Service | enable and start Fail2Ban"
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: "Service | restart Fail2Ban when managed config changed"
  ansible.builtin.service:
    name: fail2ban
    state: restarted
    enabled: true
  when: >-
    install_fail2ban_daemon_config.changed or
    install_fail2ban_filter_config.changed or
    install_fail2ban_jail_config.changed

- name: "Verify | gather service facts after activation"
  ansible.builtin.service_facts:

- name: "Verify | assert Fail2Ban service is active"
  ansible.builtin.assert:
    that:
      - ansible_facts.services['fail2ban.service'].state == 'running'
    fail_msg: "Fail2Ban service is not running after activation."
    success_msg: "Fail2Ban service is running."

- name: "Verify | show loaded jails"
  ansible.builtin.command:
    cmd: fail2ban-client status
  register: install_fail2ban_status
  changed_when: false

- name: "Verify | print Fail2Ban status"
  ansible.builtin.debug:
    var: install_fail2ban_status.stdout_lines

- name: "Verify | test nftables ban action with documentation IP"
  when: install_fail2ban_run_nft_test_ban | bool
  block:
    - name: "Verify | ban documentation test IP"
      ansible.builtin.command:
        cmd: "fail2ban-client set apache-malicious-paths banip {{ install_fail2ban_test_ban_ip }}"
      changed_when: false

    - name: "Verify | verify test IP appears in nftables ruleset"
      ansible.builtin.command:
        cmd: nft list ruleset
      register: install_fail2ban_nft_ruleset
      changed_when: false
      failed_when: install_fail2ban_test_ban_ip not in install_fail2ban_nft_ruleset.stdout
  always:
    - name: "Verify | unban documentation test IP"
      ansible.builtin.command:
        cmd: "fail2ban-client set apache-malicious-paths unbanip {{ install_fail2ban_test_ban_ip }}"
      changed_when: false
      failed_when: false
