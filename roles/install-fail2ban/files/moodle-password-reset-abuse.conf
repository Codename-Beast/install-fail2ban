[Definition]
# Managed by Ansible role install-fail2ban.
#
# Moodle password-reset abuse watch:
# - counts POST submissions to login/forgot_password.php
# - focuses on account enumeration via repeated reset attempts
# - GET page views are intentionally ignored; only submitted forms count
# - status code is intentionally irrelevant because Moodle should not reveal
#   account existence via different HTTP status codes.
#
# Regex breakdown
#   ^(?:\S+:\d+\s+)?        optional "ip:port" prefix (e.g. reverse proxy log)
#   <HOST>                  client IP (Fail2ban placeholder)
#   \s+\S+\s+\S+\s+         logname + user fields ("- -" in Combined Log Format)
#   \[[^\]]*\]\s+           timestamp block, e.g. [26/Jul/2026:18:16:08 +0200]
#   "POST                   opening quote + method; only submitted reset forms
#                           count, not ordinary page loads
#   \s+(?:https?://[^/\s"]+)?   optional absolute-URL host part (http://host)
#   /(?:[^/\s"?]+/)*        optional Moodle subdirectory installation prefix
#   login/forgot_password\.php  Moodle password reset endpoint
#   (?:[?#][^\s"]*)?        optional query string or fragment after the file
#   \s+HTTP/(0.9|1.0|1.1|2|2.0|3)" explicit HTTP version + closing quote
#   \s+\d{3}                any status code; body differences are not visible
#   \s+(?:\d+|-)\s+"..."\s+"..."  strict Combined Log suffix: size, referer, UA, end of line
#
# Note: no ".*" before the request field. The request is anchored directly after
# the timestamp so User-Agent/Referer log injection cannot fake another request.
#
# Caveat: one real user may submit this once or twice. Repeated submissions from
# one source in a short window are more likely enumeration than normal usage, so
# this jail uses a lower threshold than regular login/token abuse.

# Fail2Ban DateDetector strips the recognized timestamp text before failregex is applied;
# only the surrounding brackets remain as [], hence [^\]]* (zero-or-more)
# instead of [^\]]+ (one-or-more) in the timestamp field.
failregex = ^(?:\S+:\d+\s+)?<HOST>\s+\S+\s+\S+\s+\[[^\]]*\]\s+"POST\s+(?:https?://[^/\s"]+)?/(?:[^/\s"?]+/)*login/forgot_password\.php(?:[?#][^\s"]*)?\s+HTTP/(?:0\.9|1\.0|1\.1|2(?:\.0)?|3)"\s+\d{3}\s+(?:\d+|-)\s+"[^"]*"\s+"[^"]*"$

ignoreregex =
