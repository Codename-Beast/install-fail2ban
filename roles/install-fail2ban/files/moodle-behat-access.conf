[Definition]
# Managed by Ansible role install-fail2ban.
#
# Moodle Behat exposure watch:
# - matches only Apache access-log requests for Behat-related paths
# - counts HTTP 200 and 404 responses for Behat-related paths
# - HTTP 200 means Behat content is publicly exposed and must be banned immediately
# - HTTP 404 still catches repeated probing for hidden/leftover Behat paths
#
# Regex breakdown:
#   ^(?:\S+:\d+\s+)?        optional "ip:port" prefix (e.g. reverse proxy log)
#   <HOST>                  client IP (Fail2ban placeholder)
#   \s+\S+\s+\S+\s+         logname + user fields ("- -" in Combined Log Format)
#   \[[^\]]*\]\s+           timestamp block, e.g. [26/Jul/2026:18:16:08 +0200]
#   "(?:GET|POST|...)       opening quote + HTTP method
#   \s+(?:https?://[^/\s"]+)?   optional absolute-URL host part (http://host)
#   (?:behat...|admin/tool...) root-level Behat-related path (case-insensitive)
#   (?=[/?#\s"])            segment boundary; avoids matching arbitrary words containing "behat"
#   [^\s"]*                 rest of path/query
#   \s+HTTP/(0.9|1.0|1.1|2|2.0|3)" explicit HTTP version + closing quote
#   \s+(?:200|404)          200 means exposed Behat content; 404 means probing leftovers
#   \s+(?:\d+|-)\s+"..."\s+"..."  strict Combined Log suffix: size, referer, UA, end of line
#
# Fail2Ban reacts after Apache has logged the response. A 200 on these paths is
# a high-confidence exposure signal and is handled by the jail with maxretry=1.

#
# Caveats:
# - This filter is scoped to root-level Behat-related paths and does not search
#   arbitrary query strings for the word "behat".
# - The pattern anchors directly at the request field; there is no ".*" before
#   the opening request quote, so forged request strings in referer/User-Agent
#   fields do not affect counting.

# Fail2Ban DateDetector strips the recognized timestamp text before failregex is applied;
# only the surrounding brackets remain as [], hence [^\]]* (zero-or-more)
# instead of [^\]]+ (one-or-more) in the timestamp field.
failregex = ^(?:\S+:\d+\s+)?<HOST>\s+\S+\s+\S+\s+\[[^\]]*\]\s+"(?:GET|POST|HEAD|OPTIONS|PUT|DELETE|PATCH|PROPFIND|CONNECT|TRACE)\s+(?:https?://[^/\s"]+)?(?i:/(?:behat(?:\.yml|_data|_moodledata)?|admin/tool/behat|lib/behat|vendor/(?:bin/)?behat))(?=[/?#\s"])[^\s"]*\s+HTTP/(?:0\.9|1\.0|1\.1|2(?:\.0)?|3)"\s+(?:200|404)\s+(?:\d+|-)\s+"[^"]*"\s+"[^"]*"$

ignoreregex =
