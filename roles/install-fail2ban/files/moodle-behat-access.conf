[Definition]
# Managed by Ansible role install-fail2ban.
#
# Moodle Behat exposure watch:
# - matches only Apache access-log requests for Behat-related paths
# - counts only HTTP 404 responses; existing/publicly served resources are not matched here
# - the jail threshold decides when repeated probes become a temporary ban
#
# Regex breakdown:
#   ^(?:\S+:\d+\s+)?        optional "ip:port" prefix (e.g. reverse proxy log)
#   <HOST>                  client IP (Fail2ban placeholder)
#   \s+\S+\s+\S+\s+         logname + user fields ("- -" in Combined Log Format)
#   \[[^\]]*\]\s+           timestamp block, e.g. [26/Jul/2026:18:16:08 +0200]
#   "(?:GET|POST|...)       opening quote + HTTP method
#   \s+(?:https?://[^/\s"]+)?   optional absolute-URL host part (http://host)
#   [^\s"?]*                path prefix up to the Behat segment
#   (?i:/(?:behat...))      Behat-related path segment (case-insensitive)
#   (?=[/?#\s"])            segment boundary; avoids matching arbitrary words containing "behat"
#   [^\s"]*                 rest of path/query
#   \s+HTTP/\d(?:\.\d)?"    HTTP version + closing quote
#   \s+404                  404 only; the web server has already hidden the path from the client
#   (?:\s+.*)?$             rest of line (size, referer, user-agent) ignored
#
# Fail2Ban cannot return the 404 before the user sees it; that must be done by
# Apache/Nginx/application routing. This filter intentionally reacts only after
# the 404 was logged and then bans repeated probing.

# Fail2Ban DateDetector strips the recognized timestamp text before failregex is applied;
# only the surrounding brackets remain as [], hence [^\]]* (zero-or-more)
# instead of [^\]]+ (one-or-more) in the timestamp field.
failregex = ^(?:\S+:\d+\s+)?<HOST>\s+\S+\s+\S+\s+\[[^\]]*\]\s+"(?:GET|POST|HEAD|OPTIONS|PUT|DELETE|PATCH|PROPFIND|CONNECT|TRACE)\s+(?:https?://[^/\s"]+)?[^\s"?]*(?i:/(?:behat(?:\.yml|_data|_moodledata)?|admin/tool/behat|lib/behat|vendor/(?:bin/)?behat))(?=[/?#\s"])[^\s"]*\s+HTTP/\d(?:\.\d)?"\s+404(?:\s+.*)?$

ignoreregex =
