[Definition]
# Managed by Ansible role install-fail2ban.
#
# Moodle web-service abuse watch:
# - counts GET and POST requests to Moodle's real web-service execution endpoints
# - does not count token acquisition itself; moodle-badbots covers login/token.php
# - status code is intentionally irrelevant: successful calls can be the abuse signal
# - behavioral/threshold-based, not high-confidence: mobile apps and integrations
#   can legitimately call these endpoints.
#
# Regex breakdown
#   ^(?:\S+:\d+\s+)?        optional "ip:port" prefix (e.g. reverse proxy log)
#   <HOST>                  client IP (Fail2ban placeholder)
#   \s+\S+\s+\S+\s+         logname + user fields ("- -" in Combined Log Format)
#   \[[^\]]*\]\s+           timestamp block, e.g. [26/Jul/2026:18:16:08 +0200]
#   "(?:GET|POST)           opening quote + method; REST may use GET or POST,
#                           SOAP/XML-RPC are normally POST, both are counted
#   \s+(?:https?://[^/\s"]+)?   optional absolute-URL host part (http://host)
#   /(?:[^/\s"?]+/)*        optional Moodle subdirectory installation prefix
#   webservice/.../server.php  Moodle web-service execution endpoints
#   (?:[?#][^\s"]*)?        optional query string or fragment after the file
#   \s+HTTP/\d(?:\.\d)?"    HTTP version + closing quote
#   \s+\d{3}                any status code; the volume threshold decides abuse
#   (?:\s+.*)?$             rest of line (size, referer, user-agent) ignored
#
# Note: no ".*" before the request field. The request is anchored directly after
# the timestamp so User-Agent/Referer log injection cannot fake another request.
#
# Caveat: a single matched web-service call can be legitimate. Tune maxretry and
# findtime per tenant, and use the jail-local ignoreip variable for trusted
# integration backends that would otherwise look like high-volume API clients.

# Fail2Ban DateDetector strips the recognized timestamp text before failregex is applied;
# only the surrounding brackets remain as [], hence [^\]]* (zero-or-more)
# instead of [^\]]+ (one-or-more) in the timestamp field.
failregex = ^(?:\S+:\d+\s+)?<HOST>\s+\S+\s+\S+\s+\[[^\]]*\]\s+"(?:GET|POST)\s+(?:https?://[^/\s"]+)?/(?:[^/\s"?]+/)*webservice/rest/server\.php(?:[?#][^\s"]*)?\s+HTTP/\d(?:\.\d)?"\s+\d{3}(?:\s+.*)?$
            ^(?:\S+:\d+\s+)?<HOST>\s+\S+\s+\S+\s+\[[^\]]*\]\s+"(?:GET|POST)\s+(?:https?://[^/\s"]+)?/(?:[^/\s"?]+/)*webservice/xmlrpc/server\.php(?:[?#][^\s"]*)?\s+HTTP/\d(?:\.\d)?"\s+\d{3}(?:\s+.*)?$
            ^(?:\S+:\d+\s+)?<HOST>\s+\S+\s+\S+\s+\[[^\]]*\]\s+"(?:GET|POST)\s+(?:https?://[^/\s"]+)?/(?:[^/\s"?]+/)*webservice/soap/server\.php(?:[?#][^\s"]*)?\s+HTTP/\d(?:\.\d)?"\s+\d{3}(?:\s+.*)?$

ignoreregex =
