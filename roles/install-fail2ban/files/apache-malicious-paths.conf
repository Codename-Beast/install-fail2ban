[Definition]
# Managed by Ansible role install-fail2ban.
#
# High-confidence web probes. The request path may be absolute
# (http://host/.env) or relative (/public_html/.env). Keep this filter focused:
# add only paths that should never be fetched by normal Moodle users.
#
# Regex breakdown:
#   ^(?:\S+:\d+\s+)?        optional "ip:port" prefix (e.g. reverse proxy log)
#   <HOST>                  client IP (Fail2ban placeholder)
#   \s+\S+\s+\S+\s+         logname + user fields ("- -" in Combined Log Format)
#   \[[^\]]*\]\s+           timestamp block, e.g. [26/Jul/2026:18:16:08 +0200]
#   "(?:GET|POST|...)       opening quote + HTTP method
#   \s+(?:https?://[^/\s"]+)?   optional absolute-URL host part (http://host)
#   [^\s"?]*                path prefix up to the sensitive segment
#   (?i:/(?:\.env...|%2e%65%6e%76...|...))
#                           all .env/.env.* variants, common percent-encoded
#                           .env probes, and other sensitive paths
#   (?=[/?#\s"])            lookahead: must end at "/", "?", "#", space or quote
#                           (blocks false hits like ".envelope" matching ".env")
#   [^\s"]*                 rest of the path/query, still inside the real request field
#   \s+HTTP/(0.9|1.0|1.1|2|2.0|3)" explicit HTTP version + closing quote
#   \s+\d{3}                any status code (probe attempt counts regardless
#                           of whether Apache returned 403/404/200/etc.)
#   \s+(?:\d+|-)\s+"..."\s+"..."  strict Combined Log suffix: size, referer, UA, end of line
#
# Note: no ".*" before the opening quote -> the request field is anchored
# right after the timestamp, so a forged User-Agent/Referer containing a
# fake '"GET ... HTTP/1.1"' string cannot hijack or obscure the real match (log injection).

# Fail2Ban DateDetector strips the recognized timestamp text before failregex is applied;
# only the surrounding brackets remain as [], hence [^\]]* (zero-or-more)
# instead of [^\]]+ (one-or-more) in the timestamp field.
failregex = ^(?:\S+:\d+\s+)?<HOST>\s+\S+\s+\S+\s+\[[^\]]*\]\s+"(?:GET|POST|HEAD|OPTIONS|PUT|DELETE|PATCH|PROPFIND|CONNECT|TRACE)\s+(?:https?://[^/\s"]+)?[^\s"?]*(?i:/(?:\.env(?:[._~-][A-Za-z0-9_.~-]*)?|(?:\.|%%2e)(?:e|%%65)(?:n|%%6e)(?:v|%%76)(?:(?:[._~-]|%%2e|%%5f|%%2d|%%7e)[A-Za-z0-9_.~%%-]*)?|\.git|\.svn|\.hg|\.aws|\.ssh))(?=[/?#\s"])[^\s"]*\s+HTTP/(?:0\.9|1\.0|1\.1|2(?:\.0)?|3)"\s+\d{3}\s+(?:\d+|-)\s+"[^"]*"\s+"[^"]*"$
            ^(?:\S+:\d+\s+)?<HOST>\s+\S+\s+\S+\s+\[[^\]]*\]\s+"(?:GET|POST|HEAD|OPTIONS|PUT|DELETE|PATCH|PROPFIND|CONNECT|TRACE)\s+(?:https?://[^/\s"]+)?[^\s"?]*(?i:/(?:wp-login\.php|xmlrpc\.php|wp-admin|phpmyadmin|pma|adminer(?:\.php|[-_][A-Za-z0-9_.-]*\.php|/)?|vendor/phpunit|eval-stdin\.php|cgi-bin|actuator|boaform|hnap1))(?=[/?#\s"])[^\s"]*\s+HTTP/(?:0\.9|1\.0|1\.1|2(?:\.0)?|3)"\s+\d{3}\s+(?:\d+|-)\s+"[^"]*"\s+"[^"]*"$
            ^(?:\S+:\d+\s+)?<HOST>\s+\S+\s+\S+\s+\[[^\]]*\]\s+"(?:GET|POST|HEAD|OPTIONS|PUT|DELETE|PATCH|PROPFIND|CONNECT|TRACE)\s+(?:https?://[^/\s"]+)?[^\s"?]*(?i:/(?:config\.php|composer\.(?:json|lock)|phpinfo\.php|info\.php|(?:shell|cmd|webshell|wso|c99|r57|alfa|b374k)\.php))(?=[/?#\s"])[^\s"]*\s+HTTP/(?:0\.9|1\.0|1\.1|2(?:\.0)?|3)"\s+\d{3}\s+(?:\d+|-)\s+"[^"]*"\s+"[^"]*"$
            ^(?:\S+:\d+\s+)?<HOST>\s+\S+\s+\S+\s+\[[^\]]*\]\s+"(?:GET|POST|HEAD|OPTIONS|PUT|DELETE|PATCH|PROPFIND|CONNECT|TRACE)\s+(?:https?://[^/\s"]+)?[^\s"?]*(?i:/(?:etc/passwd|proc/self/environ))(?=[/?#\s"])[^\s"]*\s+HTTP/(?:0\.9|1\.0|1\.1|2(?:\.0)?|3)"\s+\d{3}\s+(?:\d+|-)\s+"[^"]*"\s+"[^"]*"$

ignoreregex =
