[Definition]
# Managed by Ansible role install-fail2ban.
#
# High-confidence web probes. The request path may be absolute
# (http://host/.env) or relative (/public_html/.env). Keep this filter focused:
# add only paths that should never be fetched by normal Moodle users.
failregex = ^(?:\S+:\d+\s+)?<HOST>.*"(?:GET|POST|HEAD|OPTIONS|PUT|DELETE|PATCH|PROPFIND|CONNECT|TRACE)\s+(?:https?://[^/\s"]+)?[^\s"?]*(?i:/(?:\.env(?:\.[A-Za-z0-9_-]+)?|\.git|\.svn|\.hg|\.aws|\.ssh))(?=[/?#\s"])[^\s"]*\s+HTTP/\d(?:\.\d)?"\s+\d{3}(?:\s+.*)?$
            ^(?:\S+:\d+\s+)?<HOST>.*"(?:GET|POST|HEAD|OPTIONS|PUT|DELETE|PATCH|PROPFIND|CONNECT|TRACE)\s+(?:https?://[^/\s"]+)?[^\s"?]*(?i:/(?:wp-login\.php|xmlrpc\.php|wp-admin|phpmyadmin|pma|adminer(?:\.php)?|vendor/phpunit|eval-stdin\.php|cgi-bin|actuator|boaform|hnap1))(?=[/?#\s"])[^\s"]*\s+HTTP/\d(?:\.\d)?"\s+\d{3}(?:\s+.*)?$
            ^(?:\S+:\d+\s+)?<HOST>.*"(?:GET|POST|HEAD|OPTIONS|PUT|DELETE|PATCH|PROPFIND|CONNECT|TRACE)\s+(?:https?://[^/\s"]+)?[^\s"?]*(?i:/(?:config\.php|composer\.(?:json|lock)|phpinfo\.php|info\.php|(?:shell|cmd|webshell|wso|c99|r57|alfa|b374k)\.php))(?=[/?#\s"])[^\s"]*\s+HTTP/\d(?:\.\d)?"\s+\d{3}(?:\s+.*)?$
            ^(?:\S+:\d+\s+)?<HOST>.*"(?:GET|POST|HEAD|OPTIONS|PUT|DELETE|PATCH|PROPFIND|CONNECT|TRACE)\s+(?:https?://[^/\s"]+)?[^\s"?]*(?i:/(?:etc/passwd|proc/self/environ))(?=[/?#\s"])[^\s"]*\s+HTTP/\d(?:\.\d)?"\s+\d{3}(?:\s+.*)?$
ignoreregex =
