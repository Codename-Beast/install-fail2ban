[Definition]
# Managed by Ansible role install-fail2ban.
#
# High-confidence web probes. The request path may be absolute
# (http://host/.env) or relative (/public_html/.env). Keep this filter focused:
# add only paths that should never be fetched by normal Moodle users.
#
# Regex breakdown:
#   ^(?:\S+:\d+\s+)?        optional "ip:port" prefix (e.g. reverse proxy log)
#   <HOST>                  client IP (Fail2ban placeholder)
#   \s+\S+\s+\S+\s+         logname + user fields ("- -" in Combined Log Format)
#   \[[^\]]+\]\s+           timestamp block, e.g. [26/Jul/2026:18:16:08 +0200]
#   "(?:GET|POST|...)       opening quote + HTTP method
#   \s+(?:https?://[^/\s"]+)?   optional absolute-URL host part (http://host)
#   [^\s"?]*                path prefix up to the sensitive segment
#   (?i:/(?:\.env|...))     the actual sensitive path/file (case-insensitive)
#   (?=[/?#\s"])            lookahead: must end at "/", "?", "#", space or quote
#                           (blocks false hits like ".envelope" matching ".env")
#   [^\s"]*                 rest of the path (query string, trailing segments)
#   \s+HTTP/\d(?:\.\d)?"    HTTP version + closing quote
#   \s+\d{3}                any status code (probe attempt counts regardless
#                           of whether Apache returned 403/404/200/etc.)
#   (?:\s+.*)?$             rest of line (size, referer, user-agent) ignored
#
# Note: no ".*" before the opening quote -> the request field is anchored
# right after the timestamp, so a forged User-Agent/Referer containing a
# fake '"GET ... HTTP/1.1"' string cannot hijack or obscure the real match (log injection).

failregex = ^(?:\S+:\d+\s+)?<HOST>\s+\S+\s+\S+\s+\[[^\]]+\]\s+"(?:GET|POST|HEAD|OPTIONS|PUT|DELETE|PATCH|PROPFIND|CONNECT|TRACE)\s+(?:https?://[^/\s"]+)?[^\s"?]*(?i:/(?:\.env(?:\.[A-Za-z0-9_-]+)?|\.git|\.svn|\.hg|\.aws|\.ssh))(?=[/?#\s"])[^\s"]*\s+HTTP/\d(?:\.\d)?"\s+\d{3}(?:\s+.*)?$
            ^(?:\S+:\d+\s+)?<HOST>\s+\S+\s+\S+\s+\[[^\]]+\]\s+"(?:GET|POST|HEAD|OPTIONS|PUT|DELETE|PATCH|PROPFIND|CONNECT|TRACE)\s+(?:https?://[^/\s"]+)?[^\s"?]*(?i:/(?:wp-login\.php|xmlrpc\.php|wp-admin|phpmyadmin|pma|adminer[-\w.]*\.php|vendor/phpunit|eval-stdin\.php|cgi-bin|actuator|boaform|hnap1))(?=[/?#\s"])[^\s"]*\s+HTTP/\d(?:\.\d)?"\s+\d{3}(?:\s+.*)?$
            ^(?:\S+:\d+\s+)?<HOST>\s+\S+\s+\S+\s+\[[^\]]+\]\s+"(?:GET|POST|HEAD|OPTIONS|PUT|DELETE|PATCH|PROPFIND|CONNECT|TRACE)\s+(?:https?://[^/\s"]+)?[^\s"?]*(?i:/(?:config\.php|composer\.(?:json|lock)|phpinfo\.php|info\.php|(?:shell|cmd|webshell|wso|c99|r57|alfa|b374k)\.php))(?=[/?#\s"])[^\s"]*\s+HTTP/\d(?:\.\d)?"\s+\d{3}(?:\s+.*)?$
            ^(?:\S+:\d+\s+)?<HOST>\s+\S+\s+\S+\s+\[[^\]]+\]\s+"(?:GET|POST|HEAD|OPTIONS|PUT|DELETE|PATCH|PROPFIND|CONNECT|TRACE)\s+(?:https?://[^/\s"]+)?[^\s"?]*(?i:/(?:etc/passwd|proc/self/environ))(?=[/?#\s"])[^\s"]*\s+HTTP/\d(?:\.\d)?"\s+\d{3}(?:\s+.*)?$

ignoreregex =