[Definition]
# Managed by Ansible role install-fail2ban.
#
# Moodle-specific behavioral filter. It only counts repeated POST requests to
# login/token endpoints. Normal page views, course access, static assets, cron
# and ordinary API reads are intentionally not matched.
failregex = ^(?:\S+:\d+\s+)?<HOST>.*"POST\s+(?:https?://[^/\s"]+)?/(?:[^/\s"?]+/)*login/index\.php(?:[?#][^\s"]*)?\s+HTTP/\d(?:\.\d)?"\s+\d{3}(?:\s+.*)?$
            ^(?:\S+:\d+\s+)?<HOST>.*"POST\s+(?:https?://[^/\s"]+)?/(?:[^/\s"?]+/)*login/token\.php(?:[?#][^\s"]*)?\s+HTTP/\d(?:\.\d)?"\s+\d{3}(?:\s+.*)?$
ignoreregex =
