[Definition]
# Managed by Ansible role install-fail2ban.
#
# Moodle-specific behavioral filter. It only counts repeated POST requests to
# login/token endpoints. Normal page views, course access, static assets, cron
# and ordinary API reads are intentionally not matched.
#
# Regex breakdown
#   ^(?:\S+:\d+\s+)?        optional "ip:port" prefix (e.g. reverse proxy log)
#   <HOST>                  client IP (Fail2ban placeholder)
#   \s+\S+\s+\S+\s+         logname + user fields ("- -" in Combined Log Format)
#   \[[^\]]*\]\s+           timestamp block, e.g. [26/Jul/2026:18:16:08 +0200]
#   "POST                   opening quote + method (only POST counts here;
#                           GET requests to these endpoints are just page
#                           loads/redirects, not credential attempts)
#   \s+(?:https?://[^/\s"]+)?   optional absolute-URL host part (http://host)
#   /(?:[^/\s"?]+/)*        any number of leading path segments, so this still
#                           matches if Moodle is installed in a subdirectory
#                           (e.g. /moodle/login/index.php)
#   login/index\.php        target 1: web login form submission
#   login/token\.php        target 2: mobile app / web-service token endpoint
#   (?:[?#][^\s"]*)?        optional query string or fragment after the file
#   \s+HTTP/\d(?:\.\d)?"    HTTP version + closing quote
#   \s+\d{3}                any status code (failed AND successful logins both
#                           count; the jail's maxretry threshold is what turns
#                           repeated hits into a ban, not the status code)
#   (?:\s+.*)?$             rest of line (size, referer, user-agent) ignored
#
# Note: no ".*" before the opening quote -> the request field is anchored
# right after the timestamp, so a forged User-Agent/Referer containing a
# fake '"POST ... HTTP/1.1"' string cannot hijack or obscure the real match
# (log injection). This matters more here than in other filters, since a
# miscounted burst directly feeds the ban decision.
#
# Two failregex lines below cover, in order:
#   1) POST to login/index.php  (web login form, incl. subdirectory installs)
#   2) POST to login/token.php  (mobile app / web-service auth, incl. subdirs)
#
# Info!: login/token.php is also hit by the Moodle Mobile App on every normal
# login/token refresh. Behind a shared IP (school/campus NAT, CGNAT), many
# legitimate users can trigger this within one findtime window and get banned
# together. Mitigate via jail tuning (higher maxretry / shorter findtime for
# this jail specifically), ignoreip for known institution ranges, and/or
# Moodle's own account-based login lockout (which bans per account, not IP).

# Fail2Ban DateDetector strips the recognized timestamp text before failregex is applied;
# only the surrounding brackets remain as [], hence [^\]]* (zero-or-more)
# instead of [^\]]+ (one-or-more) in the timestamp field.
failregex = ^(?:\S+:\d+\s+)?<HOST>\s+\S+\s+\S+\s+\[[^\]]*\]\s+"POST\s+(?:https?://[^/\s"]+)?/(?:[^/\s"?]+/)*login/index\.php(?:[?#][^\s"]*)?\s+HTTP/\d(?:\.\d)?"\s+\d{3}(?:\s+.*)?$
            ^(?:\S+:\d+\s+)?<HOST>\s+\S+\s+\S+\s+\[[^\]]*\]\s+"POST\s+(?:https?://[^/\s"]+)?/(?:[^/\s"?]+/)*login/token\.php(?:[?#][^\s"]*)?\s+HTTP/\d(?:\.\d)?"\s+\d{3}(?:\s+.*)?$

ignoreregex =
