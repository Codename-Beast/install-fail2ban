[Definition]
# Managed by Ansible role install-fail2ban.
#
# Moodle public form abuse watch:
# - counts POST submissions to public account/contact forms that are often abused
#   for spam, account enumeration, or automated signup attempts
# - GET page views are intentionally ignored; only submitted forms count
# - status code is intentionally irrelevant because the attempt itself is the signal
#
# Covered endpoints:
# - login/signup.php
# - user/contactsitesupport.php
#
# Regex model:
# - standard Apache Combined Log Format only: request, status, size, referer, UA
# - no permissive trailing match after the User-Agent
# - request is anchored directly after the timestamp, so forged request strings in
#   Referer/User-Agent cannot trigger this filter
# - optional Moodle subdirectory installs are supported
#
# Fail2Ban DateDetector strips the recognized timestamp text before failregex is applied;
# only the surrounding brackets remain as [], hence [^\]]* (zero-or-more)
# instead of [^\]]+ (one-or-more) in the timestamp field.
failregex = ^(?:\S+:\d+\s+)?<HOST>\s+\S+\s+\S+\s+\[[^\]]*\]\s+"POST\s+(?:https?://[^/\s"]+)?/(?:[^/\s"?]+/)*login/signup\.php(?:[?#][^\s"]*)?\s+HTTP/(?:0\.9|1\.0|1\.1|2(?:\.0)?|3)"\s+\d{3}\s+(?:\d+|-)\s+"[^"]*"\s+"[^"]*"$
            ^(?:\S+:\d+\s+)?<HOST>\s+\S+\s+\S+\s+\[[^\]]*\]\s+"POST\s+(?:https?://[^/\s"]+)?/(?:[^/\s"?]+/)*user/contactsitesupport\.php(?:[?#][^\s"]*)?\s+HTTP/(?:0\.9|1\.0|1\.1|2(?:\.0)?|3)"\s+\d{3}\s+(?:\d+|-)\s+"[^"]*"\s+"[^"]*"$

ignoreregex =
