[Definition]
# Managed by Ansible role install-fail2ban.
#
# Infrastructure admin exposure watch:
# - catches public requests for Solr Admin UI and HAProxy stats endpoints when
#   they accidentally share the public Apache/Moodle reverse-proxy path
# - high-confidence when enabled: these endpoints should not be exposed through
#   the public Moodle vhost at all
# - default-off in the role because clean network segmentation makes this jail
#   mostly unnecessary, and monitoring paths can be legitimate in some topologies
#
# Regex breakdown
#   ^(?:\S+:\d+\s+)?        optional "ip:port" prefix (e.g. reverse proxy log)
#   <HOST>                  client IP (Fail2ban placeholder)
#   \s+\S+\s+\S+\s+         logname + user fields ("- -" in Combined Log Format)
#   \[[^\]]*\]\s+           timestamp block, e.g. [26/Jul/2026:18:16:08 +0200]
#   "(?:GET|POST|HEAD)      opening quote + methods commonly used for probes
#   \s+(?:https?://[^/\s"]+)?   optional absolute-URL host part (http://host)
#   /(?:solr/admin(?:/|[?#]|$)|solr/(?:%%23|#)/(?:[?#][^\s"]*)?|haproxy(?:[?;]stats(?:[;&][^\s"]*)?|[?;]csv(?:[;&][^\s"]*)?|/?(?:[?#][^\s"]*)?)|haproxy[-_]stats(?:/|[?#]|$))
#                           high-confidence Solr Admin and HAProxy stats paths
#   \s+HTTP/\d(?:\.\d)?"    HTTP version + closing quote
#   \s+\d{3}                any status code; even 403 means someone probed it
#   (?:\s+.*)?$             rest of line (size, referer, user-agent) ignored
#
# Note: no ".*" before the request field. The request is anchored directly after
# the timestamp so User-Agent/Referer log injection cannot fake another request.
#
# Caveats:
# - Generic /solr/<core>/select is intentionally not matched. Moodle/Solr setups
#   or internal search proxies may legitimately use select endpoints, and query
#   parameters alone are a weak signal in Apache access logs. Keep this filter
#   tight; add site-specific coverage only after testing against real logs.
# - This jail is not a substitute for network segmentation. Solr and HAProxy
#   admin interfaces should stay on internal interfaces or protected vhosts.
# - Enable only after testing the real access log. If monitoring legitimately
#   hits HAProxy stats through the same logpath, use ignoreip or a separate log.

# Fail2Ban DateDetector strips the recognized timestamp text before failregex is applied;
# only the surrounding brackets remain as [], hence [^\]]* (zero-or-more)
# instead of [^\]]+ (one-or-more) in the timestamp field.
failregex = ^(?:\S+:\d+\s+)?<HOST>\s+\S+\s+\S+\s+\[[^\]]*\]\s+"(?:GET|POST|HEAD)\s+(?:https?://[^/\s"]+)?/(?:solr/admin(?:/[^\s"]*|[?#][^\s"]*)?|solr/(?:%%23|#)/(?:[?#][^\s"]*)?|haproxy[?;](?:stats|csv)(?:[;&][^\s"]*)?|haproxy[-_]stats(?:/[^\s"]*|[?#][^\s"]*)?)\s+HTTP/\d(?:\.\d)?"\s+\d{3}(?:\s+.*)?$

ignoreregex =
