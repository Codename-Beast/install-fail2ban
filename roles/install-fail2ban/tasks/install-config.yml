# =========================================
# Install Fail2Ban Role
# Developer: BSC Bernd Schreistetter
# Company: eLeDia GmbH
# =========================================
---
# Paketstatus zuerst lesen: vorbereitete Hosts sollen nicht unnötig in apt laufen.
- name: "Setup | collect installed packages"
  package_facts:
    manager: auto

- name: "Setup | detect missing Fail2Ban packages"
  set_fact:
    fail2ban_missing_packages: >-
      {{
        fail2ban_packages
        | reject('in', ansible_facts.packages.keys() | list)
        | list
      }}

- name: "Setup | show existing Fail2Ban packages"
  debug:
    msg: "All Fail2Ban packages are already installed; skipping apt."
  when: fail2ban_missing_packages | length == 0

- name: "Setup | install missing Fail2Ban packages"
  apt:
    name: "{{ fail2ban_missing_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101
  when: fail2ban_missing_packages | length > 0

# jail.conf belongs to the Debian package. If it was deleted, restore the
# matching package version instead of maintaining a second copy in this role.
- name: "Setup | check package jail.conf"
  stat:
    path: /etc/fail2ban/jail.conf
  register: fail2ban_jail_conf_stat

- name: "Setup | restore missing package jail.conf"
  when: not fail2ban_jail_conf_stat.stat.exists
  block:
    - name: "Setup | create service policy backup directory"
      tempfile:
        state: directory
        path: /tmp
        prefix: install-fail2ban-policy-
      register: fail2ban_policy_rc_d_tempdir

    - name: "Setup | check existing service policy"
      stat:
        path: /usr/sbin/policy-rc.d
        follow: false
      register: fail2ban_policy_rc_d_stat

    - name: "Setup | preserve existing service policy"
      command:
        argv:
          - mv
          - --
          - /usr/sbin/policy-rc.d
          - "{{ fail2ban_policy_rc_d_tempdir.path }}/policy-rc.d"
      register: fail2ban_policy_rc_d_backup
      changed_when: true
      when: fail2ban_policy_rc_d_stat.stat.exists

    - name: "Setup | install temporary service policy"
      copy:
        dest: /usr/sbin/policy-rc.d
        content: |
          #!/bin/sh
          exit 101
        owner: root
        group: root
        mode: "0755"
      register: fail2ban_temporary_policy_rc_d

    - name: "Setup | reinstall Fail2Ban package"
      command:
        cmd: >-
          apt-get -o Dpkg::Options::=--force-confmiss
          --reinstall install --yes fail2ban
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: true
      # The apt module cannot reinstall an already installed package.
      # noqa: command-instead-of-module

  always:
    - name: "Setup | remove temporary service policy"
      file:
        path: /usr/sbin/policy-rc.d
        state: absent
      when:
        - fail2ban_temporary_policy_rc_d is defined
        - not (fail2ban_temporary_policy_rc_d.skipped | default(false))

    - name: "Setup | restore existing service policy"
      command:
        argv:
          - mv
          - --
          - "{{ fail2ban_policy_rc_d_tempdir.path }}/policy-rc.d"
          - /usr/sbin/policy-rc.d
      changed_when: true
      when:
        - fail2ban_policy_rc_d_backup is defined
        - fail2ban_policy_rc_d_backup.changed | default(false)

    - name: "Setup | remove service policy backup directory"
      file:
        path: "{{ fail2ban_policy_rc_d_tempdir.path }}"
        state: absent
      when: fail2ban_policy_rc_d_tempdir is defined

# Backup nur einmalig vorbereiten. Der Marker verhindert Archiv-Spam bei wiederholten Läufen.
- name: "Backup | create backup dir"
  file:
    path: "{{ fail2ban_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: fail2ban_backup_existing_config | bool

- name: "Backup | check existing config"
  stat:
    path: /etc/fail2ban
  register: fail2ban_etc_stat

- name: "Backup | check initial marker"
  stat:
    path: "{{ fail2ban_backup_marker }}"
  register: fail2ban_backup_marker_stat
  when: fail2ban_backup_existing_config | bool

- name: "Backup | create initial backup"
  command:
    cmd: "tar --create --gzip --file={{ fail2ban_backup_dir }}/fail2ban-{{ ansible_facts.date_time.iso8601_basic_short }}.tar.gz /etc/fail2ban"
  changed_when: true
  # noqa: command-instead-of-module
  when:
    - fail2ban_backup_existing_config | bool
    - fail2ban_etc_stat.stat.exists
    - not (fail2ban_backup_marker_stat.stat.exists | default(false))

- name: "Backup | write initial marker"
  copy:
    dest: "{{ fail2ban_backup_marker }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      Initial Fail2Ban backup by role install-fail2ban.
      Host: {{ inventory_hostname }}
      Timestamp: {{ ansible_facts.date_time.iso8601 }}
  when:
    - fail2ban_backup_existing_config | bool
    - fail2ban_etc_stat.stat.exists
    - not (fail2ban_backup_marker_stat.stat.exists | default(false))

- name: "Config | create config dirs"
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/fail2ban/fail2ban.d
    - /etc/fail2ban/filter.d
    - /etc/fail2ban/jail.d

# recidive reads Fail2Ban's own log. On a fresh install the service has not run
# yet, so the file must exist before fail2ban-client validates the jails.
- name: "Config | prepare recidive log"
  copy:
    content: ""
    dest: /var/log/fail2ban.log
    owner: root
    group: adm
    mode: "0640"
    force: false
  when: fail2ban_recidive_enabled | bool

# Eingeschaltete Built-in-Jails müssen auf dem Zielhost wirklich vorhanden sein.
- name: "Config | check built-in filters"
  stat:
    path: "/etc/fail2ban/filter.d/{{ item.name }}.conf"
  loop:
    - { name: "sshd", enabled: "{{ fail2ban_sshd_enabled }}" }
    - { name: "apache-overflows", enabled: "{{ fail2ban_overflows_enabled }}" }
    - { name: "apache-shellshock", enabled: "{{ fail2ban_shellshock_enabled }}" }
    - { name: "recidive", enabled: "{{ fail2ban_recidive_enabled }}" }
    - { name: "apache-auth", enabled: "{{ fail2ban_apache_auth_enabled }}" }
    - { name: "apache-badbots", enabled: "{{ fail2ban_apache_badbots_enabled }}" }
    - { name: "apache-botsearch", enabled: "{{ fail2ban_apache_botsearch_enabled }}" }
    - { name: "apache-fakegooglebot", enabled: "{{ fail2ban_apache_fakegooglebot_enabled }}" }
  register: fail2ban_builtin_filter_stats
  loop_control:
    label: "{{ item.name }}"

- name: "Config | require enabled filters"
  assert:
    that:
      - (not (item.item.enabled | bool)) or item.stat.exists
    fail_msg: >-
      Enabled Fail2Ban filter '{{ item.item.name }}' is missing on the target host
      (/etc/fail2ban/filter.d/{{ item.item.name }}.conf). Disable the jail or check the Fail2Ban package.
  loop: "{{ fail2ban_builtin_filter_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# Ab hier werden verwaltete Dateien geschrieben; Handler validieren vor Reload/Restart.
- name: "Config | install daemon config"
  copy:
    src: 99-web-protection.local
    dest: /etc/fail2ban/fail2ban.d/99-web-protection.local
    owner: root
    group: root
    mode: "0644"
  register: fail2ban_daemon_config
  notify:
    - Validate Fail2Ban config
    - Restart Fail2Ban

- name: "Config | install static filters"
  copy:
    src: "{{ item }}"
    dest: "/etc/fail2ban/filter.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - apache-malicious-paths.conf
    - apache-infra-admin-exposure.conf
    - moodle-badbots.conf
    - moodle-webservice-abuse.conf
    - moodle-password-reset-abuse.conf
    - moodle-behat-access.conf
    - apache-scanburst.conf
  register: fail2ban_static_filter_config
  notify:
    - Validate Fail2Ban config
    - Reload Fail2Ban

# Scanner-Filter bleibt Template, damit lokale Scanner/Ignore-Listen sauber escaped werden.
- name: "Config | render scanner filter"
  template:
    src: apache-scanner-useragents.conf.j2
    dest: /etc/fail2ban/filter.d/apache-scanner-useragents.conf
    owner: root
    group: root
    mode: "0644"
  register: fail2ban_scanner_filter_config
  notify:
    - Validate Fail2Ban config
    - Reload Fail2Ban

- name: "Config | render unusual User-Agent filter"
  template:
    src: apache-unusual-useragents.conf.j2
    dest: /etc/fail2ban/filter.d/apache-unusual-useragents.conf
    owner: root
    group: root
    mode: "0644"
  register: fail2ban_unusual_useragents_filter_config
  notify:
    - Validate Fail2Ban config
    - Reload Fail2Ban

# Eine eigene Jail-Datei, kein globales [DEFAULT], damit fremde Jails unberührt bleiben.
- name: "Config | render jails"
  template:
    src: 99-apache-moodle-bots.local.j2
    dest: /etc/fail2ban/jail.d/99-apache-moodle-bots.local
    owner: root
    group: root
    mode: "0644"
  register: fail2ban_jail_config
  notify:
    - Validate Fail2Ban config
    - Reload Fail2Ban

# Force validation/reload now, not at play end. Later roles/tasks in the same
# play should never continue after this role has rendered invalid Fail2Ban files.
- name: "Config | flush pending Fail2Ban handlers"
  meta: flush_handlers
