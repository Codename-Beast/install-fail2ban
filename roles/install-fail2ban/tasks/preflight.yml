# =========================================
# Install Fail2Ban Role
# Developer: BSC Bernd Schreistetter
# Company: eLeDia GmbH
# =========================================
---
# Harte Vorprüfung: alles Gefährliche stoppt, bevor Dateien geschrieben werden.
- name: "Preflight | check supported OS"
  assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - ansible_facts.distribution in ['Debian', 'Ubuntu']
    fail_msg: >-
      install-fail2ban supports Debian/Ubuntu only. Detected:
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
    success_msg: "Supported system detected: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"

- name: "Preflight | check Ansible version"
  assert:
    that: "ansible_version.full is version('2.12.10', '>=')"
    fail_msg: "install-fail2ban requires ansible-core >= 2.12.10 (found: {{ ansible_version.full }})"

- name: "Preflight | find nft binary"
  stat:
    path: "{{ item }}"
  loop:
    - /usr/sbin/nft
    - /usr/bin/nft
    - /sbin/nft
    - /bin/nft
  register: fail2ban_nft_command_stats

- name: "Preflight | require nftables"
  fail:
    msg: >-
      Abort: nftables/nft is missing on the target host. This role does not install nftables automatically.
      Prepare nftables and run the role again.
  when:
    - fail2ban_require_nftables | bool or fail2ban_nft_allow_sets_enabled | bool
    - not (fail2ban_nft_command_stats.results | selectattr('stat.exists') | list | length > 0)

- name: "Preflight | select nft binary"
  set_fact:
    fail2ban_nft_command: >-
      {{
        fail2ban_nft_command_stats.results
        | selectattr('stat.exists')
        | map(attribute='item')
        | first
      }}
  when: fail2ban_nft_command_stats.results | selectattr('stat.exists') | list | length > 0

- name: "Preflight | detect enabled Apache jails"
  set_fact:
    # Every new Apache access/error-log jail must be added here. Otherwise an
    # enabled web jail can skip the Apache logdir preflight by accident.
    fail2ban_apache_jails_enabled: >-
      {{
        (fail2ban_malicious_paths_enabled | bool)
        or (fail2ban_moodle_badbots_enabled | bool)
        or (fail2ban_moodle_webservice_abuse_enabled | bool)
        or (fail2ban_moodle_password_reset_abuse_enabled | bool)
        or (fail2ban_moodle_form_abuse_enabled | bool)
        or (fail2ban_moodle_behat_access_enabled | bool)
        or (fail2ban_scanner_useragents_enabled | bool)
        or (fail2ban_unusual_useragents_enabled | bool)
        or (fail2ban_scanburst_enabled | bool)
        or (fail2ban_slow_scan_enabled | bool)
        or (fail2ban_infra_admin_exposure_enabled | bool)
        or (fail2ban_overflows_enabled | bool)
        or (fail2ban_shellshock_enabled | bool)
        or (fail2ban_apache_auth_enabled | bool)
        or (fail2ban_apache_badbots_enabled | bool)
        or (fail2ban_apache_botsearch_enabled | bool)
        or (fail2ban_apache_fakegooglebot_enabled | bool)
      }}

- name: "Preflight | check Apache log dir"
  stat:
    path: "{{ fail2ban_apache_log_dir }}"
  register: fail2ban_apache_log_dir_stat
  when: fail2ban_apache_jails_enabled | bool

- name: "Preflight | require Apache log dir"
  fail:
    msg: >-
      Abort: {{ fail2ban_apache_log_dir }} is missing. The enabled Apache jails expect
      file-based Apache logs. Set fail2ban_require_apache_log_dir: false only intentionally.
  when:
    - fail2ban_require_apache_log_dir | bool
    - fail2ban_apache_jails_enabled | bool
    - not (fail2ban_apache_log_dir_stat.stat.exists | default(false))

# Only explicit variables feed ignoreip. The role no longer reads nftables sets
# as whitelist input; that proved too fragile across customer firewalls.
- name: "Preflight | build effective whitelist"
  set_fact:
    fail2ban_effective_ignoreip: >-
      {{
        (
          (fail2ban_base_ignoreip | default([]))
          + (fail2ban_ignoreip | default([]))
          + (fail2ban_trusted_ips | default([]))
          + (fail2ban_admin_ips | default([]))
          + (fail2ban_allowed_ips | default([]))
        ) | unique | list
      }}
