---
fail2ban_role_version: "1.3.0"

# Fail2Ban role defaults
#
# Security model:
#   - nftables must already exist on the target host.
#   - The role installs Fail2Ban only, not nftables.
#   - Managed jails live in a dedicated file.
#   - No global [DEFAULT] jail block is written to avoid changing unrelated jails.
#   - Whitelisting is rendered per managed jail as ignoreip.

# -- Packages ------------------------------------------------------
fail2ban_packages:
  - fail2ban

# -- Preflight -----------------------------------------------------
fail2ban_require_nftables: true
fail2ban_require_apache_log_dir: true
fail2ban_apache_log_dir: /var/log/apache2

# -- Backup --------------------------------------------------------
# Initial safety backup. The marker prevents one tar archive per idempotent run.
fail2ban_backup_existing_config: true
fail2ban_backup_dir: /root/fail2ban-backup
fail2ban_backup_marker: /root/fail2ban-backup/.fail2ban_initial_backup_done

# -- IP-Whitelist --------------------------------------------------
# Base addresses are always protected from bans.
fail2ban_base_ignoreip:
  - 127.0.0.1/8
  - "::1"

# Additional legacy entries. Base loopback entries are always merged separately.
fail2ban_ignoreip: []

# Additional trusted source IPs. nftables is the primary source.
fail2ban_trusted_ips: []
fail2ban_allowed_ips: []
# Example:
# fail2ban_allowed_ips:
#   - 203.0.113.55
#   - 198.51.100.0/24

# Discover trusted address sets from their use in nftables accept rules.
# Set names and comments are intentionally irrelevant.
fail2ban_nft_whitelist_import_enabled: true
fail2ban_nft_whitelist_require_match: true
# nft JSON normally renders the SSH service as numeric port 22.
# Override this list when Fail2Ban protects a non-standard SSH port.
fail2ban_nft_sshd_ports:
  - "22"
  - "3333"
  - ssh

# -- Log paths -----------------------------------------------------
# Active logs only. Do not use *access.log because rotated files may be included.
fail2ban_access_log: /var/log/apache2/*access.log
fail2ban_error_log: /var/log/apache2/*error.log

# -- Fail2Ban Action Defaults -------------------------------------
fail2ban_banaction: nftables
fail2ban_banaction_allports: "nftables[type=allports]"
fail2ban_backend: auto
fail2ban_usedns: "no"
fail2ban_ignoreself: true

# Prefer fail2ban-client reload for jail/filter-only changes on a running service.
# Daemon config changes still use a service restart.
fail2ban_reload_on_change: true

# -- Managed jails -------------------------------------------------
# Recommended defaults: these jails are enabled by default.
fail2ban_sshd_enabled: true
fail2ban_malicious_paths_enabled: true
fail2ban_moodle_badbots_enabled: true
fail2ban_moodle_behat_access_enabled: true
fail2ban_scanner_useragents_enabled: true
fail2ban_unusual_useragents_enabled: true
fail2ban_scanburst_enabled: true
fail2ban_overflows_enabled: true
fail2ban_shellshock_enabled: true
fail2ban_recidive_enabled: true

# Useful, but not enabled blindly. Test against real logs first.
fail2ban_apache_auth_enabled: false
fail2ban_apache_badbots_enabled: true
fail2ban_apache_botsearch_enabled: false

# -- SSH daemon protection -----------------------------------------
# SSH is read from systemd-journal only; no file-log fallback.
fail2ban_sshd_port: "22,3333"
fail2ban_sshd_backend: systemd
fail2ban_sshd_maxretry: 5
fail2ban_sshd_findtime: 10m
fail2ban_sshd_bantime: 1h
fail2ban_sshd_bantime_increment: true
fail2ban_sshd_bantime_multipliers: "1 2 6 24 72"
fail2ban_sshd_bantime_maxtime: 7d
fail2ban_sshd_bantime_rndtime: 5m

# -- Scanner-User-Agents -------------------------------------------
# This list is treated as literal input and regex-escaped in the template.
# Generic tools like curl/wget/python-requests are not included by default.
fail2ban_scanner_useragents:
  - sqlmap
  - nikto
  - nmap scripting engine
  - masscan
  - zgrab
  - zmap
  - gobuster
  - dirbuster
  - dirsearch
  - feroxbuster
  - ffuf
  - wpscan
  - nuclei
  - acunetix
  - nessus
  - openvas
  - havij
  - whatweb
  - censysinspect
  - internetmeasurement
  - jaeles
  - arachni
  - wapiti
  - skipfish

# Environment-specific additions, for example an internal scanner name.
fail2ban_scanner_useragents_extra: []

# User-Agent fragments that should not be banned even when matched.
# Example: authorized internal scanner with a distinct user agent.
fail2ban_scanner_useragents_ignore: []

# -- High-confidence permanent web bans ----------------------------
fail2ban_malicious_paths_maxretry: 1
fail2ban_malicious_paths_findtime: 1d
fail2ban_malicious_paths_bantime: -1

# -- Moodle Badbots --------------------------------------------------
# Repeated POSTs to Moodle login/token endpoints. Threshold-based to avoid
# banning ordinary users after a single typo.
fail2ban_moodle_badbots_maxretry: 25
fail2ban_moodle_badbots_findtime: 10m
fail2ban_moodle_badbots_bantime: 2h
fail2ban_moodle_badbots_multipliers: "1 2 6 24"
fail2ban_moodle_badbots_maxtime: 7d
fail2ban_moodle_badbots_rndtime: 5m

# -- Moodle Behat exposure watch ------------------------------------
# HTTP 200 on a Behat path means public exposure and is banned immediately.
# HTTP 404 is still counted to catch probing for hidden/leftover Behat paths.
fail2ban_moodle_behat_access_maxretry: 1
fail2ban_moodle_behat_access_findtime: 10m
fail2ban_moodle_behat_access_bantime: 1h
# Keep the first Behat hit temporary because this jail also includes 404 probes,
# but escalate repeat offenders so scanners cannot continue every few hours.
fail2ban_moodle_behat_access_bantime_increment: true
fail2ban_moodle_behat_access_multipliers: "1 6 24 168"
fail2ban_moodle_behat_access_maxtime: 30d
fail2ban_moodle_behat_access_rndtime: 10m
# Optional jail-local exemptions. Use this for CI/staging Behat runners that
# should still be checked by other jails such as scanburst or moodle-badbots.
fail2ban_moodle_behat_access_ignoreip: []

fail2ban_scanner_useragents_maxretry: 1
fail2ban_scanner_useragents_findtime: 1d
fail2ban_scanner_useragents_bantime: -1

# -- Unusual User-Agents -------------------------------------------
# Immediate nftables ban for empty/missing/oversized User-Agent values and
# explicitly listed scanner UAs. Repeat offenders are escalated by recidive.
fail2ban_unusual_useragents_maxretry: 1
fail2ban_unusual_useragents_findtime: 10m
fail2ban_unusual_useragents_bantime: 1h
fail2ban_unusual_useragents_max_length: 256

fail2ban_overflows_maxretry: 2
fail2ban_overflows_findtime: 1d
fail2ban_overflows_bantime: -1

fail2ban_shellshock_maxretry: 1
fail2ban_shellshock_findtime: 1d
fail2ban_shellshock_bantime: -1

# -- Behavioral scanburst ------------------------------------------
# Conservative default for public Moodle systems and NAT/campus networks.
fail2ban_scanburst_maxretry: 80
fail2ban_scanburst_findtime: 5m
fail2ban_scanburst_bantime: 12h
fail2ban_scanburst_maxtime: 90d
fail2ban_scanburst_multipliers: "1 2 6 14 60 180"
fail2ban_scanburst_rndtime: 10m
fail2ban_scanburst_overalljails: false

# -- Optional low-and-slow scan detection ---------------------------
# Same signal as apache-scanburst, but over a much longer window. Keep default
# off to avoid false positives for large NAT/campus networks; enable per tenant
# when targeted slow scans are a realistic risk.
fail2ban_slow_scan_enabled: false
fail2ban_slow_scan_maxretry: 7
fail2ban_slow_scan_findtime: 14d
fail2ban_slow_scan_bantime: 7d
fail2ban_slow_scan_maxtime: 90d
fail2ban_slow_scan_multipliers: "1 2 4 8"
fail2ban_slow_scan_rndtime: 30m
fail2ban_slow_scan_overalljails: false

# -- Optional built-in Apache jails --------------------------------
fail2ban_apache_auth_maxretry: 5
fail2ban_apache_auth_findtime: 10m
fail2ban_apache_auth_bantime: 1d

fail2ban_apache_badbots_maxretry: 1
fail2ban_apache_badbots_findtime: 1d
fail2ban_apache_badbots_bantime: -1

fail2ban_apache_botsearch_maxretry: 2
fail2ban_apache_botsearch_findtime: 1d
fail2ban_apache_botsearch_bantime: 1d

# -- Recidive ------------------------------------------------------
fail2ban_recidive_maxretry: 3
fail2ban_recidive_findtime: 7d
fail2ban_recidive_bantime: -1

# -- Fail2Ban Prometheus Exporter ---------------------------------
# Official exporter: https://gitlab.com/hctrdev/fail2ban-prometheus-exporter
fail2ban_exporter_enabled: false
fail2ban_exporter_version: "0.10.3"
fail2ban_exporter_arch: linux_amd64
fail2ban_exporter_archive_url: >-
  https://gitlab.com//-/project/24199687/uploads/18c602420dfd42bdf718a70823afa657/fail2ban_exporter_0.10.3_linux_amd64.tar.gz
fail2ban_exporter_archive_checksum: "sha256:85733a343048090dba169226a8ca0b59b9cfecb9eaa163014a94146f04116e34"
fail2ban_exporter_src_dir: /usr/local/src/fail2ban_exporter
fail2ban_exporter_bin_path: /usr/local/bin/fail2ban_exporter
fail2ban_exporter_socket: /var/run/fail2ban/fail2ban.sock
fail2ban_exporter_listen_address: "127.0.0.1:9191"
fail2ban_exporter_health_url: "http://127.0.0.1:9191/metrics"
fail2ban_exporter_service_name: fail2ban-exporter

# SSH key logins use trusted source IPs; these must never be banned.
fail2ban_require_trusted_whitelist_for_sshd: true
