# Install Fail2Ban Role
# Developer: BSC Bernd Schreistetter
# Company: eLeDia GmbH
# =========================================
---
# Handler definition order is execution order in Ansible; notify-list order in
# tasks does not control it. Keep validation before restart/reload.
- name: Validate Fail2Ban config
  command:
    cmd: fail2ban-client -t
  register: fail2ban_handler_config_test
  changed_when: false

- name: Restart Fail2Ban
  service:
    name: fail2ban
    state: restarted
  when: fail2ban_daemon_config.changed | default(false) | bool

- name: Reload Fail2Ban
  command:
    cmd: fail2ban-client reload
  changed_when: true
  when:
    - fail2ban_reload_on_change | default(true) | bool
    - not (fail2ban_daemon_config.changed | default(false) | bool)

- name: Restart Fail2Ban exporter
  systemd:
    name: "{{ fail2ban_exporter_service_name }}"
    state: restarted
    enabled: true
    daemon_reload: true
